name: coparent_pickup_skip
description: |
  A coparent did Morgan a favor by switching kid pickup timing — not a thank-you
  candidate (coparent skip rule).

input:
  principal_member_id: member-principal
  party_summary:
    party_id: p-coparent
    name: Coparent
    tier: 3
    tags: ["coparent", "child_parent"]
    relationship_summary: "Child's other parent. Non-user. Logistical relationship only."
  interaction_context:
    recent_messages:
      - from_member_or_party: "p-coparent"
        when: "2026-04-20T16:00:00-04:00"
        text: "Picking up C Friday at 4 instead of 5 if that works. Got a thing."
    recent_events: []

expected_output:
  is_candidate: false
  confidence_min: 0.75
  reasons_must_include_any_of:
    - "coparent"
    - "coparenting logistics"
