pack:
  id: pipeline:crm_surface
  name: CRM surface
  version: 1.0.0
  kind: pipeline
runtime:
  language: python
  python_version: ">=3.14,<3.15"
  entrypoint: handler.py
  class: CrmSurfacePipeline
# Proactive contract metadata. AdministrateMe does not execute schedules;
# bootstrap/openclaw/cron.yaml installs the standing order into OpenClaw.
triggers:
  schedule: "0 19 * * 0"
  proactive: true
depends_on:
  skills:
    - compose_crm_surface@^1.0.0
  projections:
    - parties
events_emitted:
  - crm.surfaced
  - notification.signal.raised
  - notification.decision.made
config:
  schema: config.schema.json
  example: config.example.yaml
