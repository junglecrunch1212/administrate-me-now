# crm_surface example config.
#
# Per-member overrides shape: keys are member ids (placeholders here;
# real ids substituted by bootstrap §8 per [§12.4] tenant-identity
# firewall). Tenant-agnostic placeholder ids per the platform-code
# firewall — no specific tenant names ship in this file.
#
# Per [D22] opt-in not opt-out: crm_proactive_enabled defaults false;
# only members who explicitly enable proactive CRM surfacing receive
# a weekly composed event.

threshold_days: 90                 # parties with last_contact_at older than this are "stale"
max_surfaced_per_week: 5           # clamp: never surface more than this many in one week
cadence_day_of_week: 6             # Sunday (0=Mon, 6=Sun per ISO weekday)
cadence_local_hour: 18

per_member_overrides: {}
# Example shape (commented to keep this file tenant-agnostic):
#
# per_member_overrides:
#   member_id_example_1:
#     crm_proactive_enabled: true
#   member_id_example_2:
#     crm_proactive_enabled: true
#     threshold_days: 60
