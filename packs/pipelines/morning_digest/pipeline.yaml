pack:
  id: pipeline:morning_digest
  name: Morning digest
  version: 1.0.0
  kind: pipeline
runtime:
  language: python
  python_version: ">=3.11"
  entrypoint: handler.py
  class: MorningDigestPipeline
# Proactive contract metadata. AdministrateMe does not execute schedules;
# bootstrap/openclaw/cron.yaml installs the standing order into OpenClaw.
triggers:
  schedule: "0 7 * * *"
  proactive: true
depends_on:
  skills:
    - compose_morning_digest@^3.0.0
  projections:
    - tasks
    - commitments
    - calendars
    - recurrences
events_emitted:
  - digest.composed
  - notification.signal.raised
  - notification.decision.made
config:
  schema: config.schema.json
  example: config.example.yaml
