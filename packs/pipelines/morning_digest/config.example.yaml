# morning_digest example config.
#
# Per-member overrides are written by bootstrap. The commented example uses
# tenant-neutral identifiers so no household identity ships in platform code.

delivery_channel: imessage  # default outbound channel; override per member

per_member_overrides: {}
# Example shape (commented to keep this file tenant-agnostic):
