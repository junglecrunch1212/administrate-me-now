pack:
  id: pipeline:member_knowledge_indexing
  name: Member knowledge domain indexing
  version: 4.0.0
  kind: pipeline
runtime:
  language: python
  python_version: ">=3.14,<3.15"
  entrypoint: handler.py
  class: MemberKnowledgeIndexingPipeline
triggers:
  events:
    - member_knowledge.note_added
    - member_knowledge.note_updated
    - member_knowledge.note_corrected
    - member_knowledge.note_deleted
replay:
  on_version_change: full
depends_on:
  skills:
    - skill:extract_note_semantics
  projections:
    - member_knowledge
    - vector_search
events_emitted:
  - embedding.generated
  - embedding.revoked
  - member_knowledge.index_skipped
  - triage.intent.features_extracted
  - triage.item.proposed
  - triage.item.superseded
