pack:
  id: pipeline:commitment_extraction
  name: Commitment extraction
  version: 4.3.0
  kind: pipeline
runtime:
  language: python
  python_version: ">=3.14,<3.15"
  entrypoint: handler.py
  class: CommitmentExtractionPipeline
triggers:
  events:
    - messaging.received
    - messaging.sent
depends_on:
  skills:
    - classify_commitment_candidate@^3.0.0
    - extract_commitment_fields@^2.1.0
  projections:
    - parties              # for find_party_by_identifier
events_emitted:
  - communication_intake.source_skipped
  - commitment.proposed
  - commitment.suppressed
config:
  schema: config.schema.json
  example: config.example.yaml
