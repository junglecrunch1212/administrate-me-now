# custody_brief example config.
#
# Per-member overrides shape: keys are member ids (placeholders here;
# real ids substituted by bootstrap §8 per [§12.4] tenant-identity
# firewall). Default-true opt-out: when a coparent relationship is
# set on a member, the brief fires nightly unless the member's
# override sets `custody_brief_enabled: false`.

brief_local_hour: 20              # 20:00 member-local resolution at handler time

per_member_overrides: {}
# Example shape (commented to keep this file tenant-agnostic):
#
# per_member_overrides:
#   member_id_example_1:
#     custody_brief_enabled: false
#   member_id_example_2:
#     lookahead_days: 2
