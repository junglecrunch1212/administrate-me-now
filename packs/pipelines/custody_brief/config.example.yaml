# custody_brief example config.
#
# Per-member overrides shape: keys are member ids (placeholders here;
# real ids substituted by bootstrap §8 per [§12.4] tenant-identity
# firewall). Tenant-agnostic placeholder ids per the platform-code
# firewall — no specific tenant names ship in this file.
#
# Per [D22] opt-out (not opt-in): custody_brief_enabled defaults true
# WHEN coparent_relationship_member_id is set on the member profile.
# Members without a coparent relationship never receive a brief.

brief_local_hour: 20

per_member_overrides: {}
# Example shape (commented to keep this file tenant-agnostic):
#
# per_member_overrides:
#   member_id_example_1:
#     custody_brief_enabled: false
#   member_id_example_2:
#     lookahead_days: 2
