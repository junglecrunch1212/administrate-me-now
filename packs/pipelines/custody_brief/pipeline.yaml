pack:
  id: pipeline:custody_brief
  name: Custody brief
  version: 1.0.0
  kind: pipeline
runtime:
  language: python
  python_version: ">=3.11"
  entrypoint: handler.py
  class: CustodyBriefPipeline
# Proactive contract metadata. AdministrateMe does not execute schedules;
# bootstrap/openclaw/cron.yaml installs the standing order into OpenClaw.
triggers:
  schedule: "0 20 * * *"
  proactive: true
depends_on:
  skills:
    - compose_custody_brief@^1.0.0
  projections:
    - parties
    - calendars
events_emitted:
  - custody_brief.composed
  - notification.signal.raised
  - notification.decision.made
config:
  schema: config.schema.json
  example: config.example.yaml
