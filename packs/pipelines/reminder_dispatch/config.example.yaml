# reminder_dispatch example config.
#
# Per-member overrides shape: keys are member ids (placeholders here;
# real ids substituted by bootstrap §8 per [§12.4] tenant-identity
# firewall), values override top-level defaults.

lookahead_window_minutes: 60
min_reminder_gap_minutes: 15
dedupe_window_minutes: 90
skip_party_tags:
  - test
  - fixture

per_member_overrides: {}
