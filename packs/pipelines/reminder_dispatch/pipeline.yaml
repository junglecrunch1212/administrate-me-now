pack:
  id: pipeline:reminder_dispatch
  name: Reminder dispatch
  version: 1.0.0
  kind: pipeline
runtime:
  language: python
  python_version: ">=3.14,<3.15"
  entrypoint: handler.py
  class: ReminderDispatchPipeline
# Proactive contract metadata. AdministrateMe does not execute schedules;
# bootstrap/openclaw/cron.yaml installs the standing order into OpenClaw.
triggers:
  schedule: "*/15 * * * *"
  proactive: true
depends_on:
  skills:
    - compose_reminder@^1.0.0
  projections:
    - commitments
    - parties
events_emitted:
  - reminder.dispatched
  - notification.signal.raised
  - notification.decision.made
config:
  schema: config.schema.json
  example: config.example.yaml
