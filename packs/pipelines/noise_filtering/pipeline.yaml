pack:
  id: pipeline:noise_filtering
  name: Noise filtering
  version: 23.0.0
  kind: pipeline
runtime:
  language: python
  python_version: ">=3.14,<3.15"
  entrypoint: handler.py
  class: NoiseFilteringPipeline
triggers:
  events:
    - messaging.received
    - messaging.sent
    - telephony.sms_received
    - source.assessment.recovery_requested
    - triage.source_publication.planned
    - source.assessment.revision_requested
    - triage.source_revision_publication.planned
    - source.currentness.revision_requested
    - triage.currentness_publication.planned
replay:
  # v23 deliberately reassesses retained immutable message facts after a
  # guarded v21 attempt appended partial history. Non-anchor sources receive
  # deterministic terminal deferral; only the latest thread anchor invokes
  # the language seam and owns candidate reconciliation.
  on_version_change: full
delivery:
  # The handler is idempotent; EventBus checkpoints only the ordered success
  # prefix if one of these bounded language calls fails. Eight-way delivery is
  # the reviewed maximum for context-linked messages. Deliberately shared
  # cross-source identities use atomic first-equivalent-writer handling, and
  # transport-failure retries remain sequential within each delivery slot and
  # use two separate durable invocation identities. They never queue behind
  # other sources' retries, so eight simultaneous timeouts cannot serialize
  # into an unbounded checkpoint stall. The width remains eight throughout.
  # One recorded interpretation is collapsed to one typed candidate identity
  # before any terminal assessment or proposal append.
  concurrency: 8
depends_on:
  skills:
    - classify_message_nature@^8.0.0
  projections: []
events_emitted:
  - messaging.classified
  - messaging.semantic_features_extracted
  - triage.intent.features_extracted
  - triage.source_publication.planned
  - triage.source_publication.completed
  - triage.item.proposed
  - triage.item.superseded
  - source.assessment.recovery_refused
  - source.assessment.revision_refused
  - triage.source_revision_publication.planned
  - triage.source_revision_publication.completed
  - source.currentness.revision_refused
  - triage.currentness.features_extracted
  - triage.currentness_publication.planned
  - triage.currentness_publication.completed
