pack:
  id: pipeline:noise_filtering
  name: Noise filtering
  version: 21.0.0
  kind: pipeline
runtime:
  language: python
  python_version: ">=3.14,<3.15"
  entrypoint: handler.py
  class: NoiseFilteringPipeline
triggers:
  events:
    - messaging.received
    - messaging.sent
    - telephony.sms_received
    - source.assessment.recovery_requested
replay:
  # v21 deliberately reassesses retained immutable message facts under the
  # conservative context-pack v2 relationship and authored-text contract.
  on_version_change: full
delivery:
  # The handler is idempotent; EventBus checkpoints only the ordered success
  # prefix if one of these bounded language calls fails. Eight-way delivery is
  # the reviewed maximum for context-linked messages. Deliberately shared
  # cross-source identities use atomic first-equivalent-writer handling, and
  # only transport-failure recovery attempts serialize behind a local lock and
  # use two separate durable invocation identities so recovery is real,
  # bounded, serialized, and reusable on replay even when one provider stream
  # reaches its terminal timeout.
  # One recorded interpretation is collapsed to one typed candidate identity
  # before any terminal assessment or proposal append.
  concurrency: 8
depends_on:
  skills:
    - classify_message_nature@^7.0.0
  projections: []
events_emitted:
  - messaging.classified
  - messaging.semantic_features_extracted
  - triage.intent.features_extracted
  - triage.item.proposed
  - triage.item.superseded
  - source.assessment.recovery_refused
