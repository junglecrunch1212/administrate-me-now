pack:
  id: pipeline:noise_filtering
  name: Noise filtering
  version: 15.0.0
  kind: pipeline
runtime:
  language: python
  python_version: ">=3.14,<3.15"
  entrypoint: handler.py
  class: NoiseFilteringPipeline
triggers:
  events:
    - messaging.received
    - messaging.sent
    - telephony.sms_received
replay:
  on_version_change: full
delivery:
  # The handler is idempotent; EventBus checkpoints only the ordered success
  # prefix if one of these bounded language calls fails. Eight-way delivery is
  # the reviewed maximum for context-linked messages. Deliberately shared
  # cross-source identities use atomic first-equivalent-writer handling.
  concurrency: 8
depends_on:
  skills:
    - classify_message_nature@^6.0.1
  projections: []
events_emitted:
  - messaging.classified
  - messaging.semantic_features_extracted
  - triage.intent.features_extracted
  - triage.item.proposed
  - triage.item.superseded
