# Google Calendar adapter example config.
#
# Secret references use 1Password references per ADMINISTRATEME_BUILD.md
# §L1 — NEVER the secret value itself. The wizard (prompt 16) will own
# writing real values at install time; until then operators edit by hand.

service_account_key_ref: op://AdministrateMe/google-calendar-sandbox/service-account-json
member_id: member-sandbox
provider_account_id: google-calendar-member-sandbox
workspace: personal
permission_scope: [https://www.googleapis.com/auth/calendar.readonly]
binding_provenance: service-account-delegation
ownership_attested: true
read_only: true
calendar_id: primary
discover_calendars: true
# Optional quarantine for test/probe calendars:
# exclude_calendar_ids: [test-calendar-id]
user_email: sandbox@example.test
poll_interval_s: 60
sensitivity_floor: normal
