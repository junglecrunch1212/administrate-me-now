# Top-level dual-deployment discriminators per docs/11-split-memo-11b-ii-beta.md
# §2 + docs/04-split-memo-11b-ii.md §2 (11b-ii-β-β). `subkind: state-mirror`
# matches the bridge runtime's STATE_MIRROR_SUBKIND allow-list shipped by
# 11b-ii-α-1 (bridge/adminme_bridge/packs/__init__.py); declarative marker
# for tooling — the central supervisor loads this pack from its own registry,
# while the bridge daemon loads the separate bridge connector-pack at
# bridge/adminme_bridge/connector_packs/calendaring_apple_calendar_bridge/.
# `deployment_targets` enumerates the two deployments the adapter supports
# per [D18] (Reminders dual-deployment per memo 05 §5.4) + [D22] (Apple
# Calendar dual-deployment lineage). The runtime deployment switch is the
# `deployment_target` enum in config.schema.json (default `central`, so
# pre-β-β instances keep working).
subkind: state-mirror
deployment_targets: [central, bridge]

pack:
  id: adapter:calendaring-apple-calendar
  name: Apple Calendar central Cat-B adapter
  version: 2.0.0
  kind: adapter
  family: calendaring
  author: built-in
  license: Apache-2.0
  min_platform: 0.4.0

# [§6 invariant 10] sensitivity_floor hardcoded normal; calendar entries
# are personal but not financial/legal/health. The config loader rejects
# any attempt to lower the floor below this hardcoded class default.
sensitivity_floor: normal

runtime:
  language: python
  python_version: ">=3.14,<3.15"
  entrypoint: adapter.py
  class: AppleCalendarAdapter

# Cohort-D Cat-B adapter: documentation-only trigger metadata. The
# supervisor restarts on crash and treats the schedule as a heartbeat;
# the adapter enforces its own in-process poll cadence per
# pack-internal POLL_INTERVAL_S (default 60s).
triggers:
  kind: external_poll
  schedule: "*/1 * * * *"

depends_on:
  event_types:
    - adapter.error
    - adapter.authenticated
    - calendar.event_added

events_emitted:
  - adapter.error
  - adapter.authenticated
  - calendar.event_added

config:
  schema: config.schema.json
  example: config.example.yaml

# Framework extension fields per memo 05 §3.1 / [PM-33] / [PM-35] / [UT-27].
# Cat-B central — Apple EventKit (EKEventStore via PyObjC); inbound poll
# emits the on-main `calendar.event_added@v1` schema (no new schema
# registered per [D7]); outbound `create_event` saves an `EKEvent`
# wrapped through `adminme.lib.observation.outbound` per [§6.20].
# write_capabilities is asymmetric per [UT-27] (only `create_event` is
# implemented; update_event / delete_event are out of scope per parent
# draft). Top-level `subkind` + `deployment_targets` were added by
# 11b-ii-β-β c1 (docs/11-split-memo-11b-ii-beta.md §2); the runtime
# `capabilities[*].runtime` row stays `central` (the deployment switch
# lives in the top-level field + the `deployment_target` config enum).
capabilities:
  - kind: Cat-B
    runtime: central
    event_families: [calendar.event_added, calendar.event_updated, calendar.event_deleted, calendar.event_outcome_recorded]
write_capabilities:
  - create_event
  - update_event
  - delete_event
  - move_event
sensitivity_default: normal
sharing_model_discriminator: owner_member_id
observation_mode_required: true
dedup_strategy:
  kind: event_identifier_last_modified
