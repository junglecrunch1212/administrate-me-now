# This current schema is human-member owned and bridge-only.  The Python class
# remains reusable behind the separately supervised bridge wrapper, but the
# central adapter loader must never construct it or request EventKit access.
# A future service-owned central Apple source requires a new reviewed schema,
# provider binding, permission gate, and production-composition proof.
subkind: state-mirror
deployment_targets: [bridge]

pack:
  id: adapter:calendaring-apple-calendar
  name: Apple Calendar member-bridge Cat-B adapter
  version: 2.0.0
  kind: adapter
  family: calendaring
  author: built-in
  license: Apache-2.0
  min_platform: 0.4.0

# [§6 invariant 10] sensitivity_floor hardcoded normal; calendar entries
# are personal but not financial/legal/health. The config loader rejects
# any attempt to lower the floor below this hardcoded class default.
sensitivity_floor: normal

runtime:
  language: python
  python_version: ">=3.14,<3.15"
  entrypoint: adapter.py
  class: AppleCalendarAdapter

# Cohort-D Cat-B adapter: documentation-only trigger metadata. The
# supervisor restarts on crash and treats the schedule as a heartbeat;
# the adapter enforces its own in-process poll cadence per
# pack-internal POLL_INTERVAL_S (default 60s).
triggers:
  kind: external_poll
  schedule: "*/1 * * * *"

depends_on:
  event_types:
    - adapter.error
    - adapter.authenticated
    - calendar.event_added

events_emitted:
  - adapter.error
  - adapter.authenticated
  - calendar.event_added

config:
  schema: config.schema.json
  example: config.example.yaml

# Framework extension fields per memo 05 §3.1 / [PM-33] / [PM-35] / [UT-27].
# Cat-B member bridge — Apple EventKit (EKEventStore via PyObjC); inbound poll
# emits the on-main `calendar.event_added@v1` schema (no new schema
# registered per [D7]); outbound `create_event` saves an `EKEvent`
# wrapped through `adminme.lib.observation.outbound` per [§6.20].
# write_capabilities is asymmetric per [UT-27] (only `create_event` is
# implemented; update_event / delete_event are out of scope per parent
# draft). The bridge wrapper reuses this implementation by file; the central
# supervisor rejects this manifest before import or construction.
capabilities:
  - kind: Cat-B
    runtime: bridge
    event_families: [calendar.event_added, calendar.event_updated, calendar.event_deleted, calendar.event_outcome_recorded]
write_capabilities:
  - create_event
  - update_event
  - delete_event
  - move_event
sensitivity_default: normal
sharing_model_discriminator: owner_member_id
observation_mode_required: true
dedup_strategy:
  kind: event_identifier_last_modified
source_assurance:
  - source_events: [calendar.event_added, calendar.event_updated, calendar.event_deleted, calendar.event_outcome_recorded]
    mode: canonical_projection
    projections: [calendars]
