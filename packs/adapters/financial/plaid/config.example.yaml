# Example Plaid adapter configuration. Mirrored into config/channels.yaml
# under an `adapters:` entry with `kind: financial-plaid`.
#
# Every secret-bearing field is a 1Password reference (op://<vault>/<item>/<field>)
# per ADMINISTRATEME_BUILD.md §L1 — the adapter resolves these at start()
# via adminme.lib.crypto. NEVER paste the raw token value here.
#
# Bootstrap creates the secure references and Link flow. The tenant-neutral
# references below document the schema for a deterministic configuration file;
# they are not live credentials.
#
# sensitivity_floor is omitted intentionally — the pack hardcodes it to
# `privileged` per SYSTEM_INVARIANTS.md §6 invariant 10. If present, it
# MUST be the string "privileged"; any other value (including "normal")
# fails JSON-schema validation at load time.

item_access_token_ref: op://adminme-plaid/ins_109508/access_token
plaid_client_id_ref: op://adminme-plaid/api-credentials/client_id
plaid_secret_ref: op://adminme-plaid/api-credentials/secret

webhook_route: /webhooks/plaid

member_id: member-001
plaid_item_id: item-sandbox-abc
institution_id: ins_109508

# Optional — defaults apply if omitted.
dedupe_window_minutes: 90
backstop_poll_interval_s: 86400
