pack:
  id: adapter:messaging-gmail-api
  name: Gmail messaging adapter
  version: 1.0.0
  kind: adapter
runtime:
  language: python
  python_version: ">=3.11"
  entrypoint: adapter.py
  class: GmailAdapter
family: messaging
# Documentation-only triggers per [BUILD.md §L1]. The adapter supervisor
# runs each adapter as a long-lived asyncio.Task; the schedule below
# describes the in-process poll cadence the adapter enforces internally
# (the supervisor only restarts on crash, never polls).
triggers:
  kind: external_poll
  schedule: "*/2 * * * *"
depends_on:
  event_types:
    - adapter.error
    - adapter.authenticated
    - adapter.cursor_advanced
    - messaging.received
events_emitted:
  - adapter.error
  - adapter.authenticated
  - adapter.cursor_advanced
  - messaging.received
config:
  schema: config.schema.json
  example: config.example.yaml
# Framework extension fields per memo 05 §3.1 / [PM-33] / [PM-35].
# Added by prompt 11r-a (Cohort C retrofit) — closes the
# advisory_pending_retrofit finding the 11-β validator surfaces on
# base_class_conformance. `dedup_strategy` is declared as a mapping per
# the on-main AdapterManifest model (`dict[str, Any] | None`); the
# `external_id` kind matches Gmail's stable message-id semantics.
capabilities:
  - kind: Cat-A
    runtime: central
    event_families: [messaging.received]
observation_mode_required: true
sharing_model_discriminator: owner_member_id
dedup_strategy:
  kind: external_id
