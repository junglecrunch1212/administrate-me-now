# Top-level dual-deployment discriminators per docs/10-split-memo-11b-ii-alpha.md
# §2 + docs/04-split-memo-11b-ii.md §2 (11b-ii-α-2). `subkind: state-mirror`
# matches the bridge runtime's STATE_MIRROR_SUBKIND allow-list shipped by
# 11b-ii-α-1 (bridge/adminme_bridge/packs/__init__.py:24); declarative marker
# for tooling — the central supervisor loads this pack from its own registry
# (see F-9 in prompt 11b-ii-α-2), while the bridge daemon loads the separate
# bridge connector-pack at bridge/adminme_bridge/connector_packs/reminders_apple_eventkit_bridge/.
# `deployment_targets` enumerates the two deployments the adapter supports
# per [D18] (Reminders dual-deployment per memo 05 §5.4) + [D22] (Apple
# Calendar dual-deployment lineage). The runtime deployment switch is the
# `deployment_target` enum in config.schema.json (default `central`, so
# pre-α-2 instances keep working).
subkind: state-mirror
deployment_targets: [central, bridge]

pack:
  id: adapter:reminders-apple-eventkit
  name: Apple Reminders bidirectional adapter
  version: 2.0.0
  kind: adapter
  family: reminders
  author: built-in
  license: Apache-2.0
  min_platform: 0.4.0

# Adapter-level constants. The runtime treats `sensitivity_floor` as a
# hardcoded pack property per SYSTEM_INVARIANTS.md §6 invariant 10. The
# Reminders adapter is `normal`-floor (compare to Plaid's `privileged`):
# household-task granularity is personal but not financial/legal/health.
# The per-item privacy boundary is the `never-sync` predicate (list-name
# substring + #private tag + child/ambient member role), applied at BOTH
# inbound and outbound boundaries inside the adapter — not at the floor.
# Adapters don't auto-elevate; the config loader rejects any attempt to
# raise this to `privileged`. Mirrored as `"const": "normal"` in
# config.schema.json so JSON-schema validation rejects malformed configs
# before the loader runs.
sensitivity_floor: normal

# Trigger model. The adapter owns provider synchronization through two
# 30-second watcher loops (inbound poll and outbound mirror write). This is
# not an AdministrateMe product scheduler.
triggers:
  kind: external_poll
  poll_interval_seconds: 30
  description: |
    The adapter enforces 30-second inbound polls and outbound mirror-write
    batches internally.

# Event types the adapter emits or consumes. The three cross-cutting
# `adapter.*` schemas come from prompt 11a c1
# (adminme/events/schemas/adapters.py); `reminder.list_item.synced` is
# new in prompt 11c c1 (adminme/events/schemas/reminders.py).
# `reminder.dispatched` and `task.created` are consumed only after they are
# official household state. Unconfirmed proposal events are deliberately not
# subscribed; Triage must resolve and route them first.
# Registration happens at module import time per DECISIONS.md §D7.
depends_on:
  event_types:
    - adapter.error
    - adapter.authenticated
    - adapter.cursor_advanced
    - reminder.list_item.synced
    - reminder.dispatched
    - task.created

# Events emitted by THIS adapter (distinct from `depends_on`, which lists
# every event type the adapter touches in either direction). Documented
# for operator clarity; the loader does not gate on this list.
events_emitted:
  - adapter.error
  - adapter.authenticated
  - adapter.cursor_advanced
  - reminder.list_item.synced
  - list.created
  - list.updated
  - list.deleted
  - list_item.added
  - list_item.updated
  - list_item.completed
  - list_item.uncompleted
  - list_item.deleted

# Config schema reference. The supervisor's loader validates each
# adapter entry from channels.yaml against this schema before
# instantiating the adapter.
config:
  schema: config.schema.json
  example: config.example.yaml

# Documentation-only metadata (the loader ignores everything below
# `pack:` other than the schema/example refs above; the active runtime
# contract for the adapter class lives at adapter.py implementing the
# adminme.adapters.base.Adapter Protocol).
documentation:
  build_spec: ADMINISTRATEME_BUILD.md#apple-reminders-bidirectional--detailed-spec
  reference: docs/reference/apple-eventkit/_index.md
  cursor_kind: list_identifier_last_modified
  bidirectional: true
  inbound_poll_interval_s: 30
  outbound_poll_interval_s: 30
  never_sync_rules:
    - list-name substring (default ["Work", "Case", "Client"], case-insensitive)
    - item tag substring (default ["#private"], case-insensitive, matched on title+notes)
    - owning member role in {"child", "ambient"}

# Framework extension fields per memo 05 §3.1 / [PM-33] / [PM-35] / [UT-27].
# Added by prompt 11r-c (Cohort C retrofit, step 3 of 3) — closes the THIRD
# and FINAL advisory_pending_retrofit finding the 11-β validator surfaces on
# base_class_conformance, closing Cohort C. `dedup_strategy` is declared as
# a mapping per the on-main AdapterManifest model (`dict[str, Any] | None`);
# the `external_id` kind matches the existing per-reminder dedupe semantics
# (EKReminder.calendarItemIdentifier is the stable per-reminder key — same
# `_seen_inbound` cache key the adapter uses for inbound dedupe today).
capabilities:
  - kind: Cat-B
    runtime: central
    event_families: [reminder.list_item.synced, list.created, list.updated, list.deleted, list_item.added, list_item.updated, list_item.completed, list_item.uncompleted, list_item.deleted]
write_capabilities:
  - create_reminder
  - update_reminder
  - delete_reminder
  - complete_reminder
  - uncomplete_reminder
  - move_reminder
  - create_list
  - update_list
  - delete_list
sensitivity_default: normal
sharing_model_discriminator: owner_member_id
dedup_strategy:
  kind: calendar_item_identifier_last_modified
