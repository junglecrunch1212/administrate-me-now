pack:
  id: adapter:tasks-google-tasks
  name: Google Tasks central adapter
  version: 2.1.0
  kind: adapter
  family: tasks
  author: built-in
  license: Apache-2.0
  min_platform: 0.4.0

# [§6 invariant 10] sensitivity_floor hardcoded normal; task list items
# are personal but not financial/legal/health. The config loader rejects
# any attempt to lower the floor below this hardcoded class default.
sensitivity_floor: normal

runtime:
  language: python
  python_version: ">=3.14,<3.15"
  entrypoint: adapter.py
  class: GoogleTasksAdapter

# Cohort-D Cat-B adapter: documentation-only trigger metadata. The
# supervisor restarts on crash and treats the schedule as a heartbeat;
# the adapter enforces its own in-process poll cadence per
# pack-internal POLL_INTERVAL_S (default 60s).
triggers:
  kind: external_poll
  schedule: "*/1 * * * *"

depends_on:
  event_types:
    - adapter.error
    - adapter.authenticated
    - adapter.cursor_advanced
    - list_item.added
    - list_item.updated
    - list_item.completed
    - list_item.uncompleted
    - list_item.deleted
    - list.created
    - list.updated
    - list.deleted

events_emitted:
  - adapter.error
  - adapter.authenticated
  - adapter.cursor_advanced
  - list_item.added
  - list_item.updated
  - list_item.completed
  - list_item.uncompleted
  - list_item.deleted
  - list.created
  - list.updated
  - list.deleted

config:
  schema: config.schema.json
  example: config.example.yaml

# Framework extension fields per memo 05 §3.1 / [PM-33] / [PM-35] / [UT-27].
# Cat-B central — Google Tasks v1 API. Inbound polling mirrors lists and
# task transitions into canonical typed events. Each supported provider
# mutation is separately declared and observation-wrapped.
capabilities:
  - kind: Cat-B
    runtime: central
    event_families: [list.created, list.updated, list.deleted, list_item.added, list_item.updated, list_item.completed, list_item.uncompleted, list_item.deleted]
write_capabilities:
  - create_list
  - update_list
  - delete_list
  - create_task
  - update_task
  - delete_task
  - complete_task
  - uncomplete_task
  - move_task
  - clear_completed_tasks
sensitivity_default: normal
sharing_model_discriminator: owner_member_id
observation_mode_required: true
dedup_strategy:
  kind: external_id
source_assurance:
  - source_events: [list.created, list.updated, list.deleted, list_item.added, list_item.updated, list_item.completed, list_item.uncompleted, list_item.deleted]
    mode: canonical_projection
    projections: [lists]
