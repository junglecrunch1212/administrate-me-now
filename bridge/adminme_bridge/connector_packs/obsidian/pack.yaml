kind: adapter
subkind: knowledge-source
entrypoint: adminme_bridge.connector_packs.obsidian:ObsidianAdapter
pack:
  name: knowledge-obsidian
  version: 1.0.0
  author: built-in
capabilities:
  - kind: Cat-D
    runtime: bridge
    event_families: [member_knowledge]
    sensitivity_default: sensitive
owner_scope_overridability_at_install: false
sharing_model_discriminator: member-private-adult-only
dedup_strategy:
  kind: external_id_and_content_sha256
config: {}
