name: Triage candidate lab

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: triage-candidate-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-regressions:
    if: github.head_ref == 'codex/source-aware-obligation-triage'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: bridge
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.6'
      - run: pipx install poetry==2.4.1
      - run: poetry sync --with dev
      - name: Generate schema metadata in credential-free lab
        run: poetry run python scripts/generate_event_lifecycle_catalog.py --output /tmp/event-lifecycle-catalog.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: triage-candidate-schema
          path: /tmp/event-lifecycle-catalog.json
      - name: Focused production and evidence regression tests
        run: poetry run pytest -q tests/unit/test_obligation_assessment.py tests/unit/test_source_policy_v2.py tests/unit/test_cross_source_reconciliation.py tests/acceptance/test_personal_obligation_assessment.py tests/acceptance/test_source_policy_v2.py tests/acceptance/test_attention_rule_lifecycle.py tests/acceptance/test_cross_source_reconciliation.py
