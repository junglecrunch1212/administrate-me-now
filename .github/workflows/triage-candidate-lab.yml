name: Triage candidate lab

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: triage-candidate-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-regressions:
    if: github.head_ref == 'codex/source-aware-obligation-triage'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: bridge
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.6'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: pipx install poetry==2.4.1
      - run: poetry sync --with dev
      - name: Generate schema metadata in credential-free lab
        run: poetry run python scripts/generate_event_lifecycle_catalog.py --output /tmp/event-lifecycle-catalog.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: triage-candidate-schema
          path: /tmp/event-lifecycle-catalog.json
      - name: Focused production and evidence regression tests
        run: poetry run pytest -q tests/unit/test_obligation_assessment.py tests/unit/test_source_policy_v2.py tests/unit/test_cross_source_reconciliation.py tests/unit/test_message_context.py tests/unit/test_pipeline_noise_filtering.py tests/acceptance/test_personal_obligation_assessment.py tests/acceptance/test_triage_interpretation_replay.py tests/acceptance/test_source_policy_v2.py tests/acceptance/test_attention_rule_lifecycle.py tests/acceptance/test_cross_source_reconciliation.py tests/acceptance/test_triage_vertical_slice.py tests/acceptance/test_event_lifecycle_matrix.py tests/acceptance/test_gate7_household_experience.py tests/acceptance/test_context_correctness_vertical_slice.py
      - name: Mypy
        if: always()
        run: poetry run mypy adminme bridge/adminme_bridge bootstrap
      - name: Pyright
        if: always()
        run: poetry run pyright adminme bridge/adminme_bridge bootstrap packs
  browser-regressions:
    if: github.head_ref == 'codex/source-aware-obligation-triage'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.6'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: pipx install poetry==2.4.1
      - run: poetry sync --with dev
      - run: npm ci --prefix tools/console-reference-harness --ignore-scripts
      - name: Real browser composition checks
        run: |
          ADMINME_GATE7_PYTHON="$(poetry env info --executable)" ADMINME_GATE7_EVIDENCE_DIR=/tmp/triage-browser-evidence npm run test:gate7 --prefix tools/console-reference-harness
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: triage-browser-evidence
          path: /tmp/triage-browser-evidence
