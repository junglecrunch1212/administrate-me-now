name: Bounded triage model lab

on:
  push:
    branches: [codex/bounded-triage-model-acceptance]
  workflow_dispatch:
    inputs:
      gateway_preflight_only:
        description: Build and prove the pinned disposable Gateway without inference
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bounded-triage-model-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: bridge
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.6"
      - name: Install locked tooling
        run: |
          pipx install poetry==2.4.1
          poetry sync --with dev --no-interaction
      - name: Verify the catalog for the new event schemas
        run: poetry run python scripts/generate_event_lifecycle_catalog.py --check
      - name: Check the bounded capture contract without model access
        run: |
          poetry run ruff check tools/triage_model_lab.py scripts/acceptance/run_triage_model_lab.py tests/unit/test_triage_model_lab.py tests/unit/test_triage_model_lab_gateway.py adminme/lib/skill_runner/wrapper.py tests/unit/test_skill_wrapper.py
          poetry run ruff format --check --diff tools/triage_model_lab.py scripts/acceptance/run_triage_model_lab.py tests/unit/test_triage_model_lab.py tests/unit/test_triage_model_lab_gateway.py adminme/lib/skill_runner/wrapper.py tests/unit/test_skill_wrapper.py
          poetry run pytest -p no:cacheprovider -q -ra --maxfail=1 tests/unit/test_triage_model_lab.py tests/unit/test_triage_model_lab_gateway.py tests/unit/test_skill_wrapper.py
      - name: Verify exact currentness and payment uncertainty regressions
        run: poetry run pytest -p no:cacheprovider -q -ra --maxfail=4 --runxfail tests/acceptance/test_triage_currentness.py tests/unit/test_triage_related_completion.py tests/unit/test_obligation_assessment.py tests/unit/test_human_triage_management.py
      - name: Verify finite currentness application and predecessor continuity
        run: poetry run pytest -p no:cacheprovider -q -ra --maxfail=3 --runxfail tests/acceptance/test_source_currentness_revision.py tests/acceptance/test_disposable_dataset_continuity.py::test_full_pointer_chain_allows_transactional_rollback_then_fresh_forward
      - name: Verify the bounded semantic correction and durable application
        run: |
          poetry run ruff check adminme packs/pipelines/noise_filtering packs/skills/classify_message_nature tests/acceptance/test_source_assessment_revision.py tests/acceptance/test_personal_obligation_assessment.py tests/acceptance/test_triage_model_lab_lifecycle.py tests/acceptance/test_triage_currentness.py tests/acceptance/test_triage_commitment_party_reference.py tests/acceptance/test_attention_rule_lifecycle.py tests/acceptance/test_bounded_triage_execution.py
          poetry run mypy adminme bridge/adminme_bridge
          poetry run pytest -p no:cacheprovider -q -ra --maxfail=5 --runxfail tests/acceptance/test_triage_commitment_party_reference.py packs/skills/classify_message_nature/tests/test_skill.py packs/pipelines/noise_filtering/tests/test_pack_load.py tests/acceptance/test_source_assessment_revision.py tests/acceptance/test_personal_obligation_assessment.py tests/acceptance/test_triage_model_lab_lifecycle.py tests/acceptance/test_attention_rule_lifecycle.py tests/acceptance/test_bounded_triage_execution.py tests/unit/test_source_assessment_recovery.py tests/unit/test_pipeline_noise_filtering.py tests/unit/test_pipeline_runner.py tests/unit/test_cross_source_reconciliation.py tests/integration/test_pipeline_10b_i_integration.py

  gateway-runtime:
    needs: capture-contract
    if: always() && (inputs.gateway_preflight_only == true || (needs.capture-contract.result == 'success' && vars.ADMINME_MODEL_LAB_APPROVED_SHA != '' && github.sha == vars.ADMINME_MODEL_LAB_APPROVED_SHA))
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      PYTHONPATH: bridge
      PYTHONDONTWRITEBYTECODE: "1"
      ADMINME_MODEL_LAB_APPROVED_SHA: ${{ vars.ADMINME_MODEL_LAB_APPROVED_SHA }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.6"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Install locked Python dependencies
        run: |
          pipx install poetry==2.4.1
          poetry sync --with dev --no-interaction
      - name: Download and authenticate the pinned OpenClaw source
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import tarfile
          import urllib.request

          versions = json.loads(pathlib.Path("bootstrap/versions.json").read_text())
          pin = versions["openclaw"]
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "openclaw-source.tar.gz"
          with urllib.request.urlopen(pin["source_archive_url"], timeout=60) as source:
              with archive.open("wb") as target:
                  shutil.copyfileobj(source, target)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          if digest != pin["source_archive_sha256"]:
              raise SystemExit("OpenClaw source archive does not match the reviewed pin")
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "openclaw-source"
          destination.mkdir()
          with tarfile.open(archive) as bundle:
              bundle.extractall(destination, filter="data")
          source_root = destination / ("openclaw-" + pin["commit"])
          if not (source_root / "openclaw.mjs").is_file():
              raise SystemExit("Pinned OpenClaw entrypoint missing")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"OPENCLAW_SOURCE_DIR={source_root}\n")
              env.write(f"OPENCLAW_PACKAGE_MANAGER={pin['package_manager']}\n")
          print(json.dumps({"openclaw_commit": pin["commit"], "archive_sha256": digest}))
          PY
      - name: Build the pinned Gateway before exposing model credentials
        run: |
          corepack enable
          corepack prepare "$OPENCLAW_PACKAGE_MANAGER" --activate
          cd "$OPENCLAW_SOURCE_DIR"
          pnpm install --frozen-lockfile
          pnpm ui:build
          pnpm build
      - name: Prove the disposable Gateway without model credentials
        env:
          OPENAI_API_KEY: ""
        run: >-
          poetry run python -m scripts.acceptance.run_triage_model_lab
          --check-gateway-only
          --source "$OPENCLAW_SOURCE_DIR"
          --output "$RUNNER_TEMP/triage-model-preflight.json"
      - name: Capture the actual classifier through the pinned Gateway
        # Ordinary pushes cannot invoke a model or reuse household credentials.
        if: inputs.gateway_preflight_only != true && vars.ADMINME_MODEL_LAB_APPROVED_SHA != '' && github.sha == vars.ADMINME_MODEL_LAB_APPROVED_SHA
        env:
          OPENAI_API_KEY: ${{ secrets.ADMINME_MODEL_LAB_OPENAI_API_KEY }}
        run: >-
          poetry run python -m scripts.acceptance.run_triage_model_lab
          --source "$OPENCLAW_SOURCE_DIR"
          --output "$RUNNER_TEMP/triage-model-capture.json"
      - name: Retain only synthetic capture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: triage-model-capture-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/triage-model-capture.json
            ${{ runner.temp }}/triage-model-preflight.json
          if-no-files-found: warn
          retention-days: 7
