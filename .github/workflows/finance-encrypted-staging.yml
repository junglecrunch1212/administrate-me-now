name: Focused Finance remaining delivery diagnosis
on:
  push:
    branches: ['codex/finance-encrypted-staging']
permissions:
  contents: read
concurrency:
  group: finance-encrypted-staging-correctness
  cancel-in-progress: false
jobs:
  summary-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMINME_TEST_MODE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: bridge
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
    steps:
      - name: Bind isolated evidence directories
        run: |
          printf 'FINANCE_STORAGE_ARTIFACT_DIR=%s/finance-summary-metadata\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'FINANCE_SUMMARY_PINS=%s/finance-summary-pins\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - run: pipx install poetry==2.4.1
      - run: poetry sync --with dev --no-interaction
      - name: Bind exact candidate and focused selection
        run: |
          mkdir "$FINANCE_SUMMARY_PINS"
          .venv/bin/python - <<'PY_CHECK'
          import ast, hashlib, json, os, pathlib, subprocess, sys
          assert sys.version_info[:3] == (3,14,7)
          assert 'ADMINME_SYNTHETIC_CALLBACK_DIAGNOSTICS' not in os.environ
          baseline='9bf5bd55292fb770e9285db0fd6dca06c5a5fa4b'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          expected=['adminme/finance/planning_store.py', 'tests/acceptance/test_finance_summary_metadata.py', 'tests/fixtures/finance_watchdog.py', 'tests/fixtures/finance_watchdog_controller.py', '.github/workflows/finance-encrypted-staging.yml']
          actual=set(subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines())
          assert actual==set(expected),actual
          pins={'adminme/finance/planning_store.py': '8cccb48ef9a74668b789b63b32233f9fd660f4ce2c960425600d6ecf8e7a0ba9', 'tests/acceptance/test_finance_summary_metadata.py': '1cf1b3bce70540076bb2077144d40033f5f5674c9942a02e1b3547ff30b4b696', 'tests/fixtures/finance_watchdog.py': '3e5b52280ebfbefe90d53fa7aa7749761338dca054bf0a8e5e2b8bce7eb7ae25', 'tests/fixtures/finance_watchdog_controller.py': 'eb2842ea072d50ef7adbf0caf20df047a2da200062c05664b74ee758bd393c06'}
          for path,digest in pins.items():
              raw=pathlib.Path(path).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==digest,path
              ast.parse(raw)
          assert subprocess.check_output(['git','rev-parse','HEAD:poetry.lock'],text=True).strip()=='cc2102f6e9dd2fd029bd636566806493c1df91dc'
          # The production builder is the exact baseline after reversing only
          # the new metadata SQL assignment and its execute argument.
          path='adminme/finance/planning_store.py'
          old=ast.parse(subprocess.check_output(['git','show',baseline+':'+path],text=True))
          new=ast.parse(pathlib.Path(path).read_text())
          old_query=next(n for n in old.body if isinstance(n,ast.FunctionDef) and n.name=='query_projection')
          new_query=next(n for n in new.body if isinstance(n,ast.FunctionDef) and n.name=='query_projection')
          new_query.body=[n for n in new_query.body if not (isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='metadata_sql' for t in n.targets))]
          legacy=next(n.value for n in ast.walk(old_query) if isinstance(n,ast.Constant) and isinstance(n.value,str) and n.value.startswith('SELECT metadata_json FROM finance_dated_projections '))
          replacements=0
          for node in ast.walk(new_query):
              if isinstance(node,ast.Call) and isinstance(node.func,ast.Attribute) and node.func.attr=='execute' and node.args and isinstance(node.args[0],ast.Name) and node.args[0].id=='metadata_sql':
                  node.args[0]=ast.Constant(legacy);replacements+=1
          assert replacements==1 and ast.dump(old,include_attributes=False)==ast.dump(new,include_attributes=False)
          expected_cases=['test_summary_replay_and_idempotent_import', 'test_summary_ingestion_keeps_revision_membership[first]', 'test_summary_ingestion_keeps_revision_membership[last]', 'test_summary_authority_revoked_after_read[native]', 'test_summary_authority_revoked_after_read[member]', 'test_summary_native_member_delivery_contract', 'test_summary_import_boundary[disabled]', 'test_summary_import_boundary[wrong_owner]', 'test_summary_import_boundary[wrong_hash]', 'test_summary_import_boundary[conflicting_retry]', 'test_summary_runtime_bounds_and_native_versions']
          assert len(expected_cases)==len(set(expected_cases))==11
          out=pathlib.Path(os.environ['FINANCE_SUMMARY_PINS'])
          (out/'expected-tests.json').write_text(json.dumps(expected_cases,indent=2)+'\n')
          tracked=subprocess.check_output(['git','ls-files','adminme','tests/fixtures','tests/acceptance/test_finance_planning.py','tests/acceptance/test_finance_summary_metadata.py','pyproject.toml','poetry.lock'],text=True).splitlines()
          source={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in tracked if pathlib.Path(p).is_file()}
          (out/'source-pins.json').write_text(json.dumps({'candidate':os.environ['GITHUB_SHA'],'baseline':baseline,'changed':expected,'pins':pins,'source':source},indent=2)+'\n')
          (out/'prior-evidence.json').write_text(json.dumps({'failed_representative':40252645394,'zip_sha256':'3ad9e51bea70055999bc488d7c96853fe2bbf43319a393ad5fa97a32c1ac928f','previous_observer45_run':40250697052,'previous_launch13_run':40252645394,'repeated_previous_tests':0,'previous_proofs_do_not_prove_this_read_path':True,'failed_summary_run':40259507076,'failed_summary_zip_sha256':'50580474bb5493364033eee8c85cd975ad87942225697a756e0e708cc5e8d2cc','failed_summary_passed':72,'failed_summary_failed':1,'failed_summary_unexecuted':5,'failed_summary_forced':True,'remaining_case_scope':11,'repeated_runtime_predecessors':5,'reused_prior_passed_nodes':67,'resource_qualified':False,'production_qualified':False},indent=2)+'\n')
          PY_CHECK
          .venv/bin/ruff check adminme/finance/planning_store.py tests/acceptance/test_finance_summary_metadata.py tests/fixtures/finance_watchdog.py tests/fixtures/finance_watchdog_controller.py
          .venv/bin/ruff format --check adminme/finance/planning_store.py tests/acceptance/test_finance_summary_metadata.py tests/fixtures/finance_watchdog.py tests/fixtures/finance_watchdog_controller.py
      - name: One bounded remaining-case diagnostic suite
        id: focused
        timeout-minutes: 3
        run: |
          mkdir "$FINANCE_STORAGE_ARTIFACT_DIR"
          .venv/bin/python -I -B tests/fixtures/finance_watchdog.py summary-metadata "$FINANCE_STORAGE_ARTIFACT_DIR"
      - name: Preserve exact outcome and bounded evidence
        if: always()
        env:
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
        run: |
          python - <<'PY_CHECK'
          import hashlib,json,math,os,pathlib,shutil,sys,xml.etree.ElementTree as E
          root=pathlib.Path(os.environ['FINANCE_STORAGE_ARTIFACT_DIR']);root.mkdir(exist_ok=True)
          pins=pathlib.Path(os.environ['FINANCE_SUMMARY_PINS']);pins.mkdir(exist_ok=True)
          expected=[];rows=[];parse_error=None;watch={}
          try:
              expected=json.loads((pins/'expected-tests.json').read_text())
              rows=E.parse(root/'results.xml').findall('.//testcase')
              watch=json.loads((root/'watchdog.json').read_text())
          except (OSError,ValueError,E.ParseError) as exc:parse_error=type(exc).__name__
          ids=[(r.attrib.get('classname'),r.attrib.get('name')) for r in rows]
          required={('tests.acceptance.test_finance_summary_metadata',name) for name in expected}
          exact=len(ids)==len(set(ids))==len(required)==11 and set(ids)==required
          clean_cases=all(not any(r.find(k) is not None for k in ('failure','error','skipped')) for r in rows)
          cleaned=watch.get('scratch_removed') is True and watch.get('remaining_owned')==[] and not (root/'scratch').exists()
          cleanup_covered=False
          try:
              limits=watch['limits'];maxima=watch['maxima'];post=watch['post_cleanup_sample'];cleanup=watch['cleanup_maxima']
              assert set(limits)==set(maxima)==set(cleanup) and len(limits)==6
              assert watch['final_sample']['at']<=post['at']<=watch['finished']
              observed=dict.fromkeys(limits,0);post_in_trace=False
              trace=root/'watchdog-trace.jsonl';assert trace.stat().st_size<=8*1024*1024
              with trace.open() as stream:
                  for line in stream:
                      row=json.loads(line);post_in_trace=post_in_trace or row==post
                      for key in limits:
                          assert type(row[key]) in (int,float) and math.isfinite(row[key])
                          observed[key]=max(observed[key],row[key])
              cleanup_covered=post_in_trace and all(maxima[k]>=max(observed[k],cleanup[k],post[k]) and maxima[k]<=limits[k] for k in limits)
          except (OSError,KeyError,ValueError,AssertionError,TypeError) as exc:
              parse_error=parse_error or 'cleanup:'+type(exc).__name__
          bounded=watch.get('absolute_bound_met') is True and not watch.get('faults') and not watch.get('forced') and watch.get('controller_exit')==0 and cleanup_covered
          complete=os.environ['FOCUSED_OUTCOME']=='success' and exact and clean_cases and cleaned and bounded and parse_error is None
          selection={'candidate':os.environ['GITHUB_SHA'],'expected':11,'executed':len(rows),'cases':ids,'exact_selection':exact,'clean_cases':clean_cases,'cleanup_confirmed':cleaned,'cleanup_samples_covered':cleanup_covered,'bounded':bounded,'parse_error':parse_error,'complete':complete,'resource_qualified':False,'production_qualified':False,'representative_run_started':False,'original_78_cohort_complete':False,'original_failure_explained':False,'reused_prior_passed_nodes':67,'repeated_runtime_predecessors':5}
          (pins/'selection-result.json').write_text(json.dumps(selection,indent=2)+'\n')
          files=sorted([p for parent in (root,pins) for p in parent.iterdir() if p.is_file() and not p.is_symlink()],key=lambda p:p.name)
          assert len({p.name for p in files})==len(files)
          records=[]
          for p in files:
              with p.open('rb') as stream:digest=hashlib.file_digest(stream,'sha256').hexdigest()
              records.append({'name':p.name,'bytes':p.stat().st_size,'sha256':digest})
          export_bounded=len(files)<=31 and sum(r['bytes'] for r in records)<=16*1024*1024-65536
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'finance-summary-upload';output.mkdir()
          manifest=json.dumps({'bounded':export_bounded,'files':records,'complete':complete,'resource_qualified':False,'production_qualified':False},indent=2)+'\n'
          assert len(manifest.encode())<=65536
          (output/'artifact-manifest.json').write_text(manifest)
          if export_bounded:
              for p in files:shutil.copyfile(p,output/p.name)
          if not export_bounded or not complete:sys.exit('focused compatibility failed/incomplete; preserve evidence, no retry or qualification')
          PY_CHECK
      - name: Upload focused compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finance-summary-metadata-compatibility
          path: ${{ runner.temp }}/finance-summary-upload
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
