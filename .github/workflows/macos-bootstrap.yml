  # Exercise the packaged installer on the current supported member platform,
  # with fresh tooling and dependency caches rather than the harness's venv.
  bridge-installed-runtime:
    needs: [release-scope]
    if: ${{ contains(fromJSON('["bridge-helper","bridge-enrollment","bridge-runtime","bridge-setup","system-wide"]'), needs.release-scope.outputs.scope) }}
    outputs:
      validated_sha: ${{ steps.validated.outputs.sha }}
    name: Packaged member bridge installation
    runs-on: macos-26
    timeout-minutes: 30
    env:
      PYTHONPATH: bridge
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: bridge-python
        with:
          python-version: "3.14.8"

      - name: Install locked test harness
        run: |
          python -m pip install "poetry==2.4.1"
          poetry sync --with dev --no-interaction

      - name: Validate bounded native Reminder colors
        run: |
          poetry run pytest -p no:cacheprovider --runxfail -q -ra \
            tests/unit/adapters/reminders/test_eventkit_color_bounds.py \
            tests/acceptance/test_eventkit_color_native.py

      - name: Record isolated member installation platform
        run: |
          sudo xcode-select --switch /Library/Developer/CommandLineTools
          uname -m
          sw_vers
          python --version
          xcode-select -p
          xcrun --find clang
          xcrun --sdk macosx --show-sdk-path

      - name: Prepare isolated Homebrew bridge interpreter
        id: homebrew-python
        run: |
          brew install python@3.14
          bridge_python="$(brew --prefix python@3.14)/bin/python3.14"
          "$bridge_python" --version
          printf 'python-path=%s\n' "$bridge_python" >> "$GITHUB_OUTPUT"

      - name: Validate packaged member installation and partial recovery
        env:
          ADMINME_RUN_BRIDGE_INSTALLER_RUNTIME: "1"
          ADMINME_BRIDGE_INSTALLER_PYTHON: ${{ steps.bridge-python.outputs.python-path }}
          ADMINME_BRIDGE_INSTALLER_HOMEBREW_PYTHON: ${{ steps.homebrew-python.outputs.python-path }}
          ADMINME_BRIDGE_INSTALLER_OLDER_DEVELOPER: /Applications/Xcode_26.6.app/Contents/Developer
          ADMINME_BRIDGE_INSTALLER_NEWER_SDK: /Library/Developer/CommandLineTools/SDKs/MacOSX27.0.sdk
          ADMINME_BRIDGE_INSTALLER_ARTIFACT_DIR: ${{ runner.temp }}/adminme-packaged-bridge-evidence
        run: |
          poetry run pytest -p no:cacheprovider --runxfail -q -ra \
            --basetemp="${RUNNER_TEMP}/adminme-packaged-bridge" \
            --junitxml="${RUNNER_TEMP}/adminme-packaged-bridge.xml" \
            tests/acceptance/test_member_bridge_installer_runtime.py
          python - "${RUNNER_TEMP}/adminme-packaged-bridge.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          suites = list(ET.parse(sys.argv[1]).getroot().iter("testsuite"))
          assert sum(int(s.get("tests", "0")) for s in suites) == 3
          assert all(int(s.get(k, "0")) == 0 for s in suites for k in ("skipped", "failures", "errors"))
          PY

      - name: Validate sealed launch lifecycle against real macOS launchd
        env:
          ADMINME_RUN_BRIDGE_LAUNCH_RUNTIME: "1"
          ADMINME_BRIDGE_LAUNCH_ARTIFACT_DIR: ${{ runner.temp }}/adminme-packaged-bridge-evidence/launchd
        run: |
          poetry run pytest -p no:cacheprovider --runxfail -q -ra \
            --basetemp="${RUNNER_TEMP}/adminme-bridge-launch" \
            --junitxml="${RUNNER_TEMP}/adminme-bridge-launch.xml" \
            tests/acceptance/test_member_bridge_launch_runtime.py
          python - "${RUNNER_TEMP}/adminme-bridge-launch.xml" <<'PY_CHECK'
          import sys
