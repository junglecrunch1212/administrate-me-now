          suites = list(ET.parse(sys.argv[1]).getroot().iter("testsuite"))
          assert sum(int(s.get("tests", "0")) for s in suites) == 2
          assert all(int(s.get(k, "0")) == 0 for s in suites for k in ("skipped", "failures", "errors"))
          PY_CHECK

      - name: Retain isolated installation result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-member-bridge-installation
          path: |
