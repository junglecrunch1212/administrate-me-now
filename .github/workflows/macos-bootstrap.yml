            ${{ runner.temp }}/adminme-bridge-launch.xml
            ${{ runner.temp }}/adminme-packaged-bridge-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Bind successful validation to this revision
        id: validated
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$actual_sha" >> "$GITHUB_OUTPUT"

  # Preserve every system-wide release stage; the stable aggregate below selects it.
  system-rehearsal:
    name: System release validation (macOS)
    needs: [release-scope, bridge-installed-runtime]
    if: ${{ always() && !github.event.pull_request.draft && needs.release-scope.result == 'success' && needs.release-scope.outputs.scope == 'system-wide' }}
    runs-on: macos-15
    # The complete rehearsal exceeded 90 minutes after all Python tests passed.
    # This is CI capacity only; runtime settlement/recovery deadlines are fixed.
