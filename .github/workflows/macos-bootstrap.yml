              assert suites and all(all(k in s.attrib and s.attrib[k].isdigit() for k in ("tests", "skipped", "failures", "errors")) for s in suites)
              tests = sum(int(s.attrib["tests"]) for s in suites)
              assert tests > 0 and len(list(root.iter("testcase"))) == tests
              assert all(int(s.attrib[k]) == 0 for s in suites for k in ("skipped", "failures", "errors"))
              assert not any(list(root.iter(k)) for k in ("skipped", "failure", "error"))
