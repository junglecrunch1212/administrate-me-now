name: macOS bootstrap contract

on:
  pull_request:
    paths:
      - "bootstrap/**"
      - "adminme/**"
      - "bridge/**"
      - "packs/**"
      - "openclaw/administrateme/**"
      - "scripts/acceptance/**"
      - "scripts/identity_scan.py"
      - "scripts/verify_invariants.sh"
      - "tests/**"
      - "tools/console-reference-harness/**"
      - "tools/gate7_visual_server.py"
      - "pyproject.toml"
      - "poetry.lock"
      - "bridge/pyproject.toml"
      - "bridge/poetry.lock"
      - ".github/workflows/administrateme-consistency.yml"
      - ".github/workflows/macos-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-free-rehearsal:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ADMINME_TEST_MODE: "1"
      PYTHONPATH: bridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record Apple architecture and validate architecture gates
        run: |
          uname -a
          python3 <<'PY'
          from pathlib import Path
          from bootstrap.preflight import PreflightFailure, run_preflight

          try:
              run_preflight(
                  Path("/tmp/never-created-adminme"),
                  system="Darwin",
                  machine="x86_64",
                  macos_version="14.0",
                  require_dependencies=False,
                  check_filevault=False,
              )
          except PreflightFailure:
              pass
          else:
              raise SystemExit("wrong architecture did not fail")
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            openclaw/administrateme/package-lock.json
            tools/console-reference-harness/package-lock.json

      - name: Install exact locked Python environment
        run: |
          python -m pip install "poetry==2.4.1"
          poetry sync --with dev --no-interaction

      - name: Validate staged intake deployment and readiness
        run: >-
          poetry run pytest -p no:cacheprovider -q -ra --maxfail=5
          tests/acceptance/test_explicit_communication_intake_policy.py
          tests/acceptance/test_communication_intake_prerequisite.py
          tests/acceptance/test_communication_intake_upgrade_chain.py
          tests/acceptance/test_readiness_audit_export.py
          tests/unit/bootstrap/test_htr10_export.py
          tests/unit/bootstrap/test_communication_intake_upgrade_safety.py
          tests/unit/bootstrap/test_source_identity.py
          tests/unit/bootstrap/test_runtime_compatibility.py
          tests/unit/bootstrap/test_recovery_readiness.py
          tests/acceptance/test_recovery_readiness_baseline.py
          tests/acceptance/test_source_currentness_revision.py::test_reviewed_retained_patch_proves_source_runtime_and_production_replay
          tests/unit/bootstrap/test_phase5_operations.py
          tests/unit/bootstrap/test_deployment_failure.py
          tests/acceptance/test_disposable_dataset_continuity.py
          tests/acceptance/test_service_process_lifecycle.py::test_interrupted_recovery_preserves_controls_until_real_stop_and_supported_retry
          tests/unit/bootstrap/test_candidate_readiness.py
          tests/unit/test_observation_readiness_window.py
          tests/unit/test_member_device_check_coverage.py
          tests/integration/test_runtime_application.py

      - name: Validate the exact native plugin contract
        run: |
          npm ci --prefix openclaw/administrateme --ignore-scripts
          npm run check --prefix openclaw/administrateme
          npm test --prefix openclaw/administrateme

      - name: Validate member browser behavior
        env:
          ADMINME_GATE7_EVIDENCE_DIR: ${{ runner.temp }}/adminme-gate7-early
        run: |
          npm ci --prefix tools/console-reference-harness --ignore-scripts
          ADMINME_GATE7_PYTHON="$(poetry env info --executable)" \
          npm run test:gate7 --prefix tools/console-reference-harness

      - name: Retain credential-free browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credential-free-member-browser
          path: ${{ runner.temp }}/adminme-gate7-early
          if-no-files-found: warn
          retention-days: 7

      - name: Validate bounded Gmail receipts and authored HTML
        run: >-
          poetry run pytest -p no:cacheprovider -q -ra
          tests/unit/test_pipeline_pack_loader.py
          tests/unit/test_pack_loader.py
          tests/unit/test_message_context.py
          tests/integration/test_gmail_observation_receipts.py
          tests/acceptance/test_authored_html_normalization.py
          tests/acceptance/test_disposable_test_acquisition.py

      - name: Validate encrypted metadata migration and production replay
        run: >-
          poetry run pytest -p no:cacheprovider -q --maxfail=5
          tests/unit/products/bridge/test_ingest_router.py
          tests/unit/bootstrap/test_disposable_test_reset.py
          tests/unit/bootstrap/test_backup_rehearsal.py
          tests/unit/test_disposable_reset_readiness.py
          tests/acceptance/test_disposable_test_reset.py
          tests/acceptance/test_disposable_test_reset_controller.py
          tests/acceptance/test_disposable_test_acquisition.py
          tests/acceptance/test_disposable_dataset_continuity.py
          tests/unit/test_disposable_dataset_continuity.py
          tests/integration/test_adapter_supervisor_gmail.py
          tests/unit/adapters/messaging/test_gmail_retrofit.py
          tests/unit/test_pipeline_pack_loader.py
          tests/unit/test_pack_loader.py
          tests/unit/test_extensions_gate6.py
          tests/unit/test_event_log.py
          tests/unit/test_event_bus.py
          tests/acceptance/test_event_log_metadata_migration.py
          tests/acceptance/test_source_assurance_metadata_replay.py
          tests/acceptance/test_release_candidate_hardening.py::test_v1_encrypted_log_migrates_in_place_and_preserves_append_only_truth
          tests/unit/bootstrap/test_restore_settlement.py
          tests/unit/bootstrap/test_phase5_operations.py
          tests/unit/bootstrap/test_source_identity.py
          tests/unit/bootstrap/test_runtime_compatibility.py
          tests/unit/bootstrap/test_activation_transaction.py
          tests/acceptance/test_upgrade_deadline_rollback.py
          tests/acceptance/test_upgrade_readiness_blackout.py
          tests/acceptance/test_runtime_readiness_publication.py
          tests/acceptance/test_bounded_member_readiness.py
          tests/acceptance/test_bounded_triage_execution.py
          tests/acceptance/test_cross_source_reconciliation.py
          tests/acceptance/test_personal_obligation_assessment.py
          tests/unit/test_cross_source_reconciliation.py
          tests/unit/test_human_triage_management.py
          tests/acceptance/test_settlement_failure_observation.py
          tests/acceptance/test_service_process_lifecycle.py
          tests/acceptance/test_cos_delegated_execution_reconciliation.py
          tests/unit/bootstrap/test_service_process_ownership.py
          tests/unit/test_source_assessment_recovery.py
          tests/unit/test_pipeline_runner.py
          tests/unit/test_pipeline_noise_filtering.py
          tests/unit/test_skill_wrapper.py
          tests/unit/test_source_assurance.py
          tests/acceptance/test_triage_vertical_slice.py::test_member_evidence_uses_exact_lookup_after_private_history
          tests/unit/bootstrap/test_settlement_readiness_blackout.py
          tests/unit/bootstrap/test_deployment_failure.py

      - name: Validate shell entrypoints
        run: |
          brew install shellcheck
          shellcheck -x bootstrap/*.sh scripts/acceptance/*.sh scripts/verify_invariants.sh
          bash -n bootstrap/*.sh scripts/acceptance/*.sh scripts/verify_invariants.sh

      - name: Build and verify the exact reviewed OpenClaw source
        run: bash scripts/acceptance/openclaw-source-install.sh

      - name: Credential-free clean install and recovery rehearsal
        run: |
          poetry run ./scripts/acceptance/clean-install.sh
          poetry run ./scripts/acceptance/macos-bootstrap-rehearsal.sh
          poetry run ./scripts/acceptance/backup-restore.sh

      - name: Static checks and secret-safe tree
        run: |
          poetry run ruff check bootstrap tests/unit/bootstrap tests/acceptance/test_macos_bootstrap_operations.py
          poetry run mypy bootstrap --no-error-summary
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          fi
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Whole-repository release-candidate suite
        run: bash scripts/acceptance/release-candidate.sh
