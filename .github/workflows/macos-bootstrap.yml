name: macOS bootstrap contract

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-bootstrap-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  release-scope:
    name: Select and validate release scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.proof.outputs.scope }}
      validated_sha: ${{ steps.proof.outputs.validated_sha }}
      interface_sha256: ${{ steps.proof.outputs.interface_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.7"
      - name: Validate release policy and protected gate behavior
        run: |
          python -m pip install 'pytest==9.0.3' 'PyYAML==6.0.3'
          python -m pytest -p no:cacheprovider --runxfail -q tests/unit/test_ci_release_gates.py
      - name: Select scope from immutable Git inputs
        id: proof
        run: >-
          python -m scripts.release_scope select
          --event "$GITHUB_EVENT_PATH" --checkout-sha "$GITHUB_SHA"
          --output "$RUNNER_TEMP/release-scope.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-scope-macos
          path: ${{ runner.temp }}/release-scope.json
          if-no-files-found: error
          retention-days: 7

  cos-reminder-validation:
    name: CoS reminder release (macos)
    needs: [release-scope]
    if: ${{ needs.release-scope.outputs.scope == 'cos-reminders' }}
    runs-on: macos-15
    timeout-minutes: 40
    env:
      ADMINME_TEST_MODE: '1'
      PYTHONPATH: bridge
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-o tmp_path_retention_policy=failed'
    outputs:
      validated_sha: ${{ steps.validated.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install locked reminder check environment
        run: |
          python -m pip install 'poetry==2.4.1'
          poetry sync --with dev --no-interaction
          npm ci --prefix openclaw/administrateme --ignore-scripts
      - name: Validate affected reminder and reply contracts
        run: bash scripts/acceptance/cos-reminder-release.sh macos
      - name: Bind successful validation to this revision
        id: validated
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$actual_sha" >> "$GITHUB_OUTPUT"

  updater-delivery-validation:
    name: Updater delivery release (macos)
    needs: [release-scope]
    if: ${{ needs.release-scope.outputs.scope == 'updater-delivery' }}
    runs-on: macos-14
    timeout-minutes: 40
    env:
      ADMINME_TEST_MODE: '1'
      PYTHONPATH: bridge
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-o tmp_path_retention_policy=failed'
    outputs:
      validated_sha: ${{ steps.validated.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install locked updater check environment
        run: |
          python -m pip install 'poetry==2.4.1'
          poetry sync --with dev --no-interaction
      - name: Validate updater preparation, activation and recovery
        run: bash scripts/acceptance/updater-delivery-release.sh macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: updater-delivery-macos
          path: ${{ runner.temp }}/updater-delivery.xml
          if-no-files-found: error
          retention-days: 7
      - name: Bind successful validation to this revision
        id: validated
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$actual_sha" >> "$GITHUB_OUTPUT"

  cos-service-work-validation:
    name: CoS service-private work (macos)
    needs: [release-scope]
    if: ${{ needs.release-scope.outputs.scope == 'cos-service-work' }}
    runs-on: macos-15
    timeout-minutes: 40
    env:
      ADMINME_TEST_MODE: '1'
      PYTHONPATH: bridge
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-o tmp_path_retention_policy=failed'
    outputs:
      validated_sha: ${{ steps.validated.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install locked service-work check environment
        run: |
          python -m pip install 'poetry==2.4.1'
          poetry sync --with dev --no-interaction
          npm ci --prefix openclaw/administrateme --ignore-scripts
      - name: Validate service identity, isolation, replay and plugin recovery
        run: bash scripts/acceptance/cos-service-work-release.sh macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: cos-service-work-macos
          path: ${{ runner.temp }}/cos-service-work.xml
          if-no-files-found: error
          retention-days: 7
      - name: Bind successful validation to this revision
        id: validated
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$actual_sha" >> "$GITHUB_OUTPUT"

  documentation-validation:
    name: Documentation release validation (macos)
    needs: [release-scope]
    if: ${{ needs.release-scope.outputs.scope == 'documentation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      validated_sha: ${{ steps.validated.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.7"
      - name: Validate prose changes and repository invariants
        run: |
          git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          bash scripts/verify_invariants.sh
      - name: Bind successful validation to this revision
        id: validated
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$actual_sha" >> "$GITHUB_OUTPUT"
  bridge-helper-validation:
    name: Bridge helper component release (macos)
    needs: [release-scope]
    if: ${{ needs.release-scope.outputs.scope == 'bridge-helper' }}
    runs-on: macos-15
    timeout-minutes: 35
    env:
      ADMINME_TEST_MODE: "1"
      PYTHONPATH: bridge
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-o tmp_path_retention_policy=failed"
    outputs:
      validated_sha: ${{ steps.validated.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.7"
      - name: Install locked component test environment
        run: |
          python -m pip install 'poetry==2.4.1'
          poetry sync --with dev --no-interaction
      - name: Validate helper integrity, recovery, and retained runtime compatibility
        run: |
          poetry run pytest -p no:cacheprovider --runxfail -q -ra \
            --basetemp="$RUNNER_TEMP/adminme-helper-component" \
            --junitxml="$RUNNER_TEMP/helper-component.xml" \
            tests/unit/bootstrap/test_member_bridge_helper_app.py \
            tests/unit/bootstrap/test_member_bridge_helper_diagnostics.py \
            tests/unit/bootstrap/test_member_bridge_permission_controller.py \
            tests/unit/bootstrap/test_member_bridge_launch.py \
            tests/unit/bootstrap/test_member_bridge_component.py \
            tests/unit/bootstrap/test_bridge_enrollment.py \
            tests/unit/test_bridge_release_identity.py \
            tests/unit/test_ci_release_gates.py \
            tests/acceptance/test_self_service_member_bridge_enrollment.py \
            tests/acceptance/test_member_bridge_permission_recovery.py \
            tests/acceptance/test_member_bridge_progress_synchronization.py \
            tests/acceptance/test_cos_member_bridge_acquisition.py \
            tests/acceptance/test_member_bridge_historical_attribution.py \
            tests/acceptance/test_bridge_readiness_transition.py
          python - "$RUNNER_TEMP/helper-component.xml" <<'CHECK'
          import sys
          import xml.etree.ElementTree as ET
          suites = list(ET.parse(sys.argv[1]).getroot().iter('testsuite'))
          assert sum(int(s.get('tests', '0')) for s in suites) > 0
          assert all(int(s.get(k, '0')) == 0 for s in suites for k in ('skipped', 'failures', 'errors'))
          CHECK
      - name: Validate component source and privacy
        run: |
          poetry run ruff check .
          poetry run ruff format --check adminme bootstrap bridge packs scripts tests tools
          poetry run mypy bootstrap bridge/adminme_bridge scripts/release_scope.py
          bash scripts/verify_invariants.sh
          poetry check --lock
          poetry -C bridge check --lock
          bash -n bootstrap/install-member-bridge.sh
          git diff --check
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: bridge-helper-component-macos
          path: ${{ runner.temp }}/helper-component.xml
          if-no-files-found: error
          retention-days: 7
      - name: Bind successful validation to this revision
        id: validated
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$actual_sha" >> "$GITHUB_OUTPUT"
  cos-recovery-history-validation:
    name: CoS recovery history release (macos)
    needs: [release-scope]
    if: ${{ needs.release-scope.outputs.scope == 'cos-recovery-history' }}
    runs-on: macos-15
    timeout-minutes: 35
    env:
      ADMINME_TEST_MODE: "1"
      PYTHONPATH: bridge
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-o tmp_path_retention_policy=failed"
    outputs:
      validated_sha: ${{ steps.validated.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14.7"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - name: Install locked recovery test environment
        run: |
          python -m pip install 'poetry==2.4.1'
          poetry sync --with dev --no-interaction
      - name: Prove retained Apple provenance and predecessor replay
        run: |
          poetry run pytest -p no:cacheprovider --runxfail -q -ra \
            --basetemp="$RUNNER_TEMP/cos-apple-history-tests" \
            --junitxml="$RUNNER_TEMP/cos-apple-history.xml" \
            tests/unit/test_cos_apple_source_history.py \
            tests/acceptance/test_cos_apple_source_history.py
      - name: Validate recovery history, fault compensation and retained compatibility
        run: |
          poetry run pytest -p no:cacheprovider --runxfail -q -ra \
            -k 'not test_sealed_component_reuses_exact_old_runtime_and_preserves_rollback and not test_sealed_mixed_release_keeps_exact_paired_archive_and_requires_central_negotiation' \
            --basetemp="$RUNNER_TEMP/cos-recovery-history-tests" \
            --junitxml="$RUNNER_TEMP/cos-recovery-history.xml" \
            tests/unit/test_historical_attribution.py \
            tests/unit/test_lifecycle_catalog.py \
            tests/unit/bootstrap/test_cos_recovery_history.py \
            tests/unit/bootstrap/test_cos_recovery_history_operation.py \
            tests/acceptance/test_cos_live_maintenance.py \
            tests/unit/bootstrap/test_cos_channel_activation.py \
            tests/unit/bootstrap/test_member_bridge_component.py \
            tests/unit/bootstrap/test_candidate_readiness.py \
            tests/unit/bootstrap/test_htr10_export.py \
            tests/unit/bootstrap/test_backup_rehearsal.py::test_streaming_backup_round_trip_and_wrong_key_cleanup \
            tests/unit/bootstrap/test_activation_transaction.py::test_interrupted_activation_restores_exact_predecessor_bytes \
            tests/unit/bootstrap/test_activation_transaction.py::test_transactional_activation_orders_fresh_rehearsal_before_selectors \
            tests/unit/bootstrap/test_phase5_operations.py::test_production_upgrade_controller_must_be_the_reviewed_candidate \
            tests/unit/test_ci_release_gates.py
      - name: Require complete recovery history evidence
        run: |
          python - "$RUNNER_TEMP/cos-recovery-history.xml" <<'PY_CHECK'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = list(root.iter("testsuite"))
          assert suites
          for suite in suites:
              assert all(k in suite.attrib and suite.attrib[k].isdigit() for k in ("tests", "skipped", "failures", "errors"))
              assert all(int(suite.attrib[k]) == 0 for k in ("skipped", "failures", "errors"))
          tests = sum(int(suite.attrib["tests"]) for suite in suites)
          assert tests > 0 and len(list(root.iter("testcase"))) == tests
          assert not any(list(root.iter(k)) for k in ("skipped", "failure", "error"))
          PY_CHECK
      - name: Validate recovery types and privacy
        run: |
          poetry run ruff check .
          poetry run ruff format --check adminme bootstrap bridge packs scripts tests tools
          poetry run mypy bootstrap bridge/adminme_bridge scripts/release_scope.py
          poetry run pyright bootstrap scripts/release_scope.py
          bash scripts/verify_invariants.sh
          poetry check --lock
          git diff --check
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: cos-recovery-history-macos
          path: |
            ${{ runner.temp }}/cos-recovery-history.xml
            ${{ runner.temp }}/cos-apple-history.xml
          if-no-files-found: error
          retention-days: 7
      - name: Bind successful validation to this revision
        id: validated
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$actual_sha" >> "$GITHUB_OUTPUT"
  google-connections-validation:
    name: Google connections release (macos)
    needs: [release-scope]
    if: ${{ needs.release-scope.outputs.scope == 'google-connections' || needs.release-scope.outputs.scope == 'cos-google-workspace' || needs.release-scope.outputs.scope == 'member-google-settings' || needs.release-scope.outputs.scope == 'cos-apple-reminders' }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      ADMINME_TEST_MODE: '1'
      PYTHONPATH: bridge
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-o tmp_path_retention_policy=failed'
    outputs:
      validated_sha: ${{ steps.validated.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install locked Google release environment
        run: |
          python -m pip install 'poetry==2.4.1'
          poetry sync --with dev --no-interaction
          npm ci --prefix openclaw/administrateme --ignore-scripts
      - name: Prove native Reminders app identity and callback boundary
        if: ${{ needs.release-scope.outputs.scope != 'member-google-settings' }}
        run: |
          poetry run pytest -p no:cacheprovider --runxfail -q -ra \
            --basetemp="$RUNNER_TEMP/cos-reminders-native-tests" \
            --junitxml="$RUNNER_TEMP/cos-reminders-native.xml" \
            tests/unit/bootstrap/test_cos_reminders_helper.py \
            tests/unit/bootstrap/test_cos_reminders_helper_app.py \
            tests/unit/bootstrap/test_cos_reminders_helper_app_macos.py \
            tests/unit/bootstrap/test_cos_reminders_helper_macos.py
          python - "$RUNNER_TEMP/cos-reminders-native.xml" <<'CHECK'
          import sys
          import xml.etree.ElementTree as ET
          suites = list(ET.parse(sys.argv[1]).getroot().iter('testsuite'))
          assert sum(int(s.get('tests', '0')) for s in suites) > 0
          assert all(int(s.get(k, '0')) == 0 for s in suites for k in ('skipped', 'failures', 'errors'))
          CHECK
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && needs.release-scope.outputs.scope != 'member-google-settings' }}
        with:
          name: cos-reminders-native-macos
          path: ${{ runner.temp }}/cos-reminders-native.xml
          if-no-files-found: error
          retention-days: 7
      - name: Validate member Google Settings and consent
        if: ${{ needs.release-scope.outputs.scope == 'member-google-settings' }}
        env:
          ADMINME_MEMBER_GOOGLE_EVIDENCE_DIR: ${{ runner.temp }}/member-google-settings
        run: bash scripts/acceptance/member-google-settings.sh macos
      - name: Validate private Google acquisition, capabilities and guarded recovery
        if: ${{ needs.release-scope.outputs.scope != 'member-google-settings' }}
        run: |
          poetry run pytest -p no:cacheprovider --runxfail -q -ra \
            --basetemp="$RUNNER_TEMP/google-connections-tests" \
            --junitxml="$RUNNER_TEMP/google-connections.xml" \
            tests/unit/bootstrap/test_cos_google_workspace.py \
            tests/unit/bootstrap/test_cos_apple_reminders.py \
            tests/acceptance/test_cos_apple_reminders_context.py \
            tests/acceptance/test_cos_service_planning_context.py \
            tests/acceptance/test_cos_service_working_context.py \
            tests/acceptance/test_cos_service_private_work.py \
            tests/integration/test_lists_projection_runner.py \
            tests/unit/test_capability_catalog.py \
            tests/unit/events/test_adapter_schemas.py \
            tests/unit/events/schemas/test_lists_schemas.py \
            packs/adapters/reminders/apple-eventkit/tests \
            tests/unit/bootstrap/test_google_oauth.py \
            tests/adapters/test_credentials.py \
            tests/unit/test_provider_bindings.py \
            packs/adapters/calendaring/google-calendar/tests/test_google_calendar_pack_internal.py \
            packs/adapters/tasks/google-tasks/tests/test_google_tasks_pack_internal.py \
            tests/acceptance/test_member_google_connections.py \
            tests/acceptance/test_cos_channel_acquisition.py \
            tests/acceptance/test_forwarded_channel_intake.py \
            tests/acceptance/test_cos_self_replies.py \
            tests/acceptance/test_cos_response_execution.py \
            tests/acceptance/test_b03_google_tasks_create_production.py \
            tests/integration/test_service_owned_google_sources.py \
            tests/integration/test_adapter_google_calendar_supervisor.py \
            tests/integration/test_adapter_google_tasks_supervisor.py \
            tests/integration/test_gmail_observation_receipts.py \
            tests/unit/adapters/calendaring/test_google_calendar.py \
            tests/unit/adapters/tasks/test_google_tasks.py \
            tests/unit/test_governance.py \
            tests/unit/test_google_tasks_execution.py \
            tests/unit/test_cos_channel_operation.py \
            tests/unit/bootstrap/test_cos_channel_activation.py \
            tests/unit/test_ci_release_gates.py
          python - "$RUNNER_TEMP/google-connections.xml" <<'CHECK'
          import sys
          import xml.etree.ElementTree as ET
          suites = list(ET.parse(sys.argv[1]).getroot().iter('testsuite'))
          assert sum(int(s.get('tests', '0')) for s in suites) > 0
          assert all(int(s.get(k, '0')) == 0 for s in suites for k in ('skipped', 'failures', 'errors'))
          CHECK
      - name: Validate affected types, privacy and plugin interfaces
        if: ${{ needs.release-scope.outputs.scope != 'member-google-settings' }}
        run: |
          poetry run ruff check .
          poetry run ruff format --check adminme bootstrap bridge packs scripts tests tools
          poetry run mypy adminme bridge/adminme_bridge bootstrap scripts/release_scope.py
          poetry run pyright adminme bridge/adminme_bridge bootstrap packs
          bash scripts/verify_invariants.sh
          npm run check --prefix openclaw/administrateme
          npm test --prefix openclaw/administrateme
          poetry check --lock
          git diff --check
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: google-connections-macos
          path: ${{ runner.temp }}/google-connections.xml
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && needs.release-scope.outputs.scope == 'member-google-settings' }}
        with:
          name: member-google-settings-macos
          path: ${{ runner.temp }}/member-google-settings
          if-no-files-found: error
          retention-days: 7
      - name: Bind successful validation to this revision
        id: validated
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$actual_sha" >> "$GITHUB_OUTPUT"
  bridge-development:
    needs: [release-scope]
    name: Bridge enrollment validation (macOS)
    if: ${{ needs.release-scope.outputs.scope == 'bridge-enrollment' || needs.release-scope.outputs.scope == 'bridge-runtime' || needs.release-scope.outputs.scope == 'bridge-setup' || (github.event.pull_request.draft && needs.release-scope.outputs.scope == 'system-wide') }}
    outputs:
      validated_sha: ${{ steps.validated.outputs.sha }}
    runs-on: macos-15
    timeout-minutes: 35
    env:
      ADMINME_TEST_MODE: "1"
      PYTHONPATH: bridge
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-o tmp_path_retention_policy=failed"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

