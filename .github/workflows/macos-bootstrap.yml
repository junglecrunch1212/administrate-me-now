        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.7"
      - name: Require complete evidence for the selected release scope
        env:
          RELEASE_NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python -m scripts.release_scope gate --platform macos
          --event "$GITHUB_EVENT_PATH" --checkout-sha "$GITHUB_SHA"
