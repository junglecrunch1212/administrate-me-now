name: AdministrateMe consistency

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  # A ready transition must not cancel useful checks at the same revision.
  # Different revisions cannot satisfy one another's protected checks.
  group: administrateme-consistency-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  bridge-development:
    name: Targeted bridge development (Linux)
    if: ${{ github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: bridge
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-o tmp_path_retention_policy=failed"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.7"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"

      - name: Install locked development environment
        run: |
          pipx install poetry==2.4.1
          poetry sync --with dev --no-interaction

      # Select by affected behavior, including real application composition;
      # this is development evidence, never a reduced release gate.
      - name: Validate bridge enrollment and installed-release identity
        run: >-
          poetry run pytest -p no:cacheprovider --runxfail -q -ra --maxfail=5
          --basetemp="${RUNNER_TEMP}/adminme-bridge-development-pytest"
          tests/acceptance/test_self_service_member_bridge_enrollment.py
          tests/acceptance/test_member_bridge_knowledge_vertical_slice.py
          tests/acceptance/test_cos_member_bridge_acquisition.py
          tests/acceptance/test_cos_channel_acquisition.py
          tests/acceptance/test_disposable_test_acquisition.py
          tests/acceptance/test_forwarded_channel_intake.py
          tests/unit/test_cos_member_bridge_acquisition_policy.py
          tests/unit/bootstrap/test_bridge_enrollment.py
          tests/unit/bootstrap/test_member_bridge_helper_app.py
          tests/unit/bootstrap/test_source_identity.py
          tests/unit/test_bridge_authorization.py
          tests/unit/test_bridge_release_identity.py
          tests/unit/test_ci_release_gates.py
          tests/unit/products/bridge
          tests/integration/test_bridge_ingest_roundtrip.py
          tests/integration/test_bridge_state_mirror_onramp.py
          tests/integration/test_runtime_application.py

      - name: Validate bridge package
        run: |
          poetry -C bridge sync --with dev --no-interaction
          poetry -C bridge run pytest -p no:cacheprovider -q -ra --maxfail=5 \
            --basetemp="${RUNNER_TEMP}/adminme-bridge-development-pytest"
          poetry -C bridge run ruff check adminme_bridge tests
          poetry -C bridge run mypy adminme_bridge

      - name: Validate architecture, style, types, and privacy
        run: |
          poetry run ruff check .
          poetry run ruff format --check --diff adminme bootstrap bridge packs scripts tests tools
          poetry run mypy adminme bridge/adminme_bridge bootstrap
          poetry run pyright adminme bridge/adminme_bridge bootstrap packs
          bash scripts/verify_invariants.sh
          poetry check --lock
          poetry -C bridge check --lock
          git diff --check "origin/${{ github.base_ref }}...HEAD"
          git diff --check
          test -z "$(git status --porcelain)"

  # Keep this job name stable because protected main requires it.
  deterministic-consistency:
    runs-on: ubuntu-latest
    # The complete rehearsal exceeded 90 minutes after all Python tests passed.
    # This is CI capacity only; runtime settlement/recovery deadlines are fixed.
    timeout-minutes: 120
    env:
      PYTHONPATH: bridge
      PYTHONDONTWRITEBYTECODE: "1"
      # Preserve failed fixtures for diagnosis, releasing passed test trees.
      PYTEST_ADDOPTS: "-o tmp_path_retention_policy=failed"
    steps:
      # Never skip the protected job: skipped jobs can satisfy protection.
      # Ready PRs execute every existing full release step below.
      - name: Require complete release validation
        if: ${{ github.event.pull_request.draft }}
        run: |
          echo "::error::Development-only draft: targeted checks cannot approve a release. Mark this PR ready after relevant regressions pass to run complete Linux and macOS validation."
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.7"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: openclaw/administrateme/package-lock.json

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Install locked dependencies
        run: poetry sync --with dev

      - name: Render lifecycle catalog for review
        run: >-
          poetry run python scripts/generate_event_lifecycle_catalog.py
          --output "${RUNNER_TEMP}/event-lifecycle-catalog.json"

      - name: Retain generated lifecycle catalog
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-event-lifecycle-catalog
          path: ${{ runner.temp }}/event-lifecycle-catalog.json
          retention-days: 3

      - name: Validate CoS channel and response boundaries
        run: |
          poetry run pytest -p no:cacheprovider -q -ra \
            --basetemp="${RUNNER_TEMP}/adminme-consistency-pytest" \
            tests/acceptance/test_cos_response_allowlist_settings.py \
            tests/acceptance/test_cos_response_execution.py \
            tests/acceptance/test_cos_identity_delegation_kernel.py \
            tests/acceptance/test_member_cos_approval.py \
            tests/unit/test_member_chat_protocol.py \
            tests/acceptance/test_member_chat_subscription.py \
            tests/acceptance/test_cos_response_text.py \
            tests/acceptance/test_cos_channel_acquisition.py \
            tests/acceptance/test_cos_live_maintenance.py \
            tests/acceptance/test_forwarded_submission_recovery.py \
            tests/acceptance/test_forwarded_submission_repair_operations.py \
            tests/acceptance/test_retired_provider_history.py \
            tests/acceptance/test_forwarded_submission_extraction.py::test_full_forward_uses_bounded_model_budget_before_creating_triage \
            tests/unit/test_submission_recovery.py \
            tests/unit/bootstrap/test_submission_repair.py \
            tests/unit/bootstrap/test_submission_repair_readiness.py \
            tests/unit/test_skill_wrapper.py \
            packs/skills/extract_note_semantics/tests/test_skill.py \
            tests/acceptance/test_disposable_dataset_continuity.py::test_accepted_bounded_dataset_survives_upgrade_rollback_and_forward_reactivation \
            tests/unit/test_cos_channel_operation.py \
            tests/unit/test_cos_response_assurance.py \
            tests/unit/test_event_log.py::test_default_recorded_at_is_precise_and_explicit_history_is_preserved \
            tests/unit/bootstrap/test_cos_channel_activation.py \
            tests/unit/test_observation.py \
            tests/unit/bootstrap/test_candidate_readiness.py \
            tests/unit/bootstrap/test_htr10_export.py \
            tests/unit/test_historical_attribution.py \
            tests/acceptance/test_forwarded_channel_intake.py::test_channel_submission_extracts_privately_and_deduplicates_after_restart \
            tests/unit/bootstrap/test_cos_imessage.py \
            tests/unit/bootstrap/test_cos_guard_release.py \
            tests/unit/bootstrap/test_cos_permissions.py \
            tests/unit/bootstrap/test_cos_messages_database.py \
            tests/unit/bootstrap/test_cos_member_topology.py \
            tests/unit/test_source_assurance.py::test_provider_effect_accounting_proves_v2_observation_suppression \
            tests/unit/test_cos_response_policy.py \
            tests/unit/test_cos_imessage_text.py \
            tests/unit/test_provider_bindings.py \
            tests/unit/test_service_identities.py \
            tests/unit/bootstrap/test_google_oauth.py \
            tests/adapters/test_credentials.py

      - name: Validate CoS native transport and plugin contract
        if: ${{ !cancelled() && !github.event.pull_request.draft }}
        run: |
          npm ci --prefix openclaw/administrateme --ignore-scripts
          npm run check --prefix openclaw/administrateme
          npm test --prefix openclaw/administrateme

      # Every pytest invocation owns the same disposable tree and clears its
      # predecessor. Keeping earlier archived/encrypted fixtures exhausted the
      # hosted runner during the full suite; the real Doctor disk gate stays.
      - name: Validate retained runtime and readiness recovery
        run: >-
          poetry run pytest -p no:cacheprovider -q -ra --maxfail=1
          --basetemp="${RUNNER_TEMP}/adminme-consistency-pytest"
          tests/unit/bootstrap/test_recovery_readiness.py
          tests/unit/bootstrap/test_release_history.py
          tests/unit/bootstrap/test_disposable_test_reset.py
          tests/acceptance/test_recovery_readiness_baseline.py
          tests/acceptance/test_disposable_dataset_continuity.py::test_full_pointer_chain_allows_transactional_rollback_then_fresh_forward
          tests/unit/bootstrap/test_runtime_compatibility.py
          tests/acceptance/test_source_currentness_revision.py::test_reviewed_retained_patch_proves_source_runtime_and_production_replay

      - name: Validate member-forwarded intake and delivery
        run: >-
          poetry run pytest -p no:cacheprovider -q -ra
          --basetemp="${RUNNER_TEMP}/adminme-consistency-pytest"
          tests/acceptance/test_explicit_communication_intake_policy.py
          tests/acceptance/test_communication_intake_prerequisite.py
          tests/acceptance/test_communication_intake_upgrade_chain.py
          tests/acceptance/test_readiness_audit_export.py
          tests/unit/bootstrap/test_htr10_export.py
          tests/acceptance/test_forwarded_channel_intake.py
          tests/acceptance/test_forwarded_submission_extraction.py
          tests/acceptance/test_provider_creation_replay.py
          tests/acceptance/test_doctor_explicit_submission.py
          tests/acceptance/test_openclaw_native_seam.py
          tests/unit/test_communication_intake_policy.py
          tests/unit/test_observation_readiness_window.py
          tests/unit/test_member_device_check_coverage.py
          tests/unit/test_provider_write_reconciliation.py
          tests/unit/test_event_log.py
          tests/unit/bootstrap/test_communication_intake_upgrade_safety.py
          tests/unit/bootstrap/test_activation_transaction.py
          tests/unit/bootstrap/test_source_identity.py
          tests/unit/bootstrap/test_runtime_compatibility.py
          tests/unit/bootstrap/test_phase5_operations.py
          tests/unit/bootstrap/test_deployment_failure.py
          tests/acceptance/test_disposable_dataset_continuity.py
          tests/acceptance/test_service_process_lifecycle.py::test_interrupted_recovery_preserves_controls_until_real_stop_and_supported_retry
          tests/unit/adapters/messaging/test_gmail_forwarded_intake.py

      - name: Validate historical review and recovery
        run: >-
          poetry run pytest -p no:cacheprovider -q -ra --maxfail=5
          --basetemp="${RUNNER_TEMP}/adminme-consistency-pytest"
          tests/acceptance/test_apple_messages_governed_reply.py
          tests/acceptance/test_source_assessment_revision.py
          tests/acceptance/test_source_currentness_revision.py
          tests/integration/test_projection_rebuild.py
          tests/unit/bootstrap/test_candidate_readiness.py

      - name: Validate architecture, style, and types
        if: ${{ !cancelled() && !github.event.pull_request.draft }}
        run: |
          poetry run ruff check .
          poetry run ruff format --check --diff adminme bootstrap bridge packs scripts tests tools
          poetry run python scripts/generate_event_lifecycle_catalog.py --check
          poetry run mypy adminme bridge/adminme_bridge bootstrap
          poetry run pyright adminme bridge/adminme_bridge bootstrap packs
          bash scripts/verify_invariants.sh
          poetry check --lock

      - name: Validate bounded Gmail receipts and authored HTML
        run: >-
          poetry run pytest -p no:cacheprovider -q -ra
          --basetemp="${RUNNER_TEMP}/adminme-consistency-pytest"
          tests/unit/test_pipeline_pack_loader.py
          tests/unit/test_pack_loader.py
          tests/unit/test_message_context.py
          tests/integration/test_gmail_observation_receipts.py
          tests/acceptance/test_authored_html_normalization.py
          tests/acceptance/test_disposable_test_acquisition.py

      - name: Validate production triage replay, activation, and rollback
        run: >-
          poetry run pytest -p no:cacheprovider -q -ra --maxfail=5
          --basetemp="${RUNNER_TEMP}/adminme-consistency-pytest"
          tests/unit/products/bridge/test_ingest_router.py
          tests/unit/bootstrap/test_disposable_test_reset.py
          tests/unit/bootstrap/test_backup_rehearsal.py
          tests/unit/test_disposable_reset_readiness.py
          tests/acceptance/test_disposable_test_reset.py
          tests/acceptance/test_disposable_test_reset_controller.py
          tests/acceptance/test_disposable_test_acquisition.py
          tests/acceptance/test_disposable_dataset_continuity.py
          tests/unit/test_disposable_dataset_continuity.py
          tests/integration/test_adapter_supervisor_gmail.py
          tests/unit/adapters/messaging/test_gmail_retrofit.py
          tests/unit/test_pipeline_pack_loader.py
          tests/unit/test_pack_loader.py
          tests/unit/test_extensions_gate6.py
          tests/unit/test_event_log.py
          tests/unit/test_event_bus.py
          tests/acceptance/test_release_candidate_hardening.py::test_v1_encrypted_log_migrates_in_place_and_preserves_append_only_truth
          tests/acceptance/test_event_log_metadata_migration.py
          tests/acceptance/test_source_assurance_metadata_replay.py
          tests/acceptance/test_runtime_triage_activation.py
          tests/acceptance/test_triage_rollback_compatibility.py
          tests/acceptance/test_runtime_spine.py
          tests/acceptance/test_cross_source_reconciliation.py
          tests/acceptance/test_personal_obligation_assessment.py
          tests/unit/test_human_triage_management.py
          tests/acceptance/test_message_context_replay_throughput.py
          tests/acceptance/test_context_correctness_vertical_slice.py
          tests/unit/test_cross_source_reconciliation.py
          tests/unit/test_message_context.py
          tests/unit/bootstrap/test_restore_settlement.py
          tests/unit/bootstrap/test_phase5_operations.py
          tests/unit/bootstrap/test_source_identity.py
          tests/unit/bootstrap/test_runtime_compatibility.py
          tests/unit/bootstrap/test_activation_transaction.py
          tests/acceptance/test_upgrade_deadline_rollback.py
          tests/acceptance/test_upgrade_readiness_blackout.py
          tests/acceptance/test_runtime_readiness_publication.py
          tests/acceptance/test_bounded_member_readiness.py
          tests/acceptance/test_bounded_triage_execution.py
          tests/acceptance/test_settlement_failure_observation.py
          tests/acceptance/test_service_process_lifecycle.py
          tests/acceptance/test_cos_delegated_execution_reconciliation.py
          tests/unit/bootstrap/test_service_process_ownership.py
          tests/unit/test_source_assessment_recovery.py
          tests/unit/test_pipeline_runner.py
          tests/unit/test_pipeline_noise_filtering.py
          tests/unit/test_skill_wrapper.py
          tests/unit/test_source_assurance.py
          tests/acceptance/test_triage_vertical_slice.py::test_member_evidence_uses_exact_lookup_after_private_history
          tests/unit/bootstrap/test_settlement_readiness_blackout.py
          tests/unit/bootstrap/test_deployment_failure.py
          tests/acceptance/test_macos_bootstrap_operations.py::test_encrypted_restore_settles_late_sources_and_quiesces_failed_state
          tests/acceptance/test_macos_bootstrap_operations.py::test_newer_restore_controller_proves_selected_predecessor_in_its_real_process
          tests/unit/test_attention_rule_scope.py
          tests/acceptance/test_attention_rule_lifecycle.py

      - name: Validate Python behavior
        # Pytest owns this one disposable tree and clears it before each run.
        # Retaining the earlier encrypted fixture trees can exhaust the next
        # suite's real Doctor disk prerequisite on the hosted Linux runner.
        run: |
          df -h "${RUNNER_TEMP}"
          poetry run pytest -p no:cacheprovider -q -ra --maxfail=5 \
            --basetemp="${RUNNER_TEMP}/adminme-consistency-pytest"
          du -sh "${RUNNER_TEMP}/adminme-consistency-pytest"

      - name: Validate release-strict acceptance
        run: |
          df -h "${RUNNER_TEMP}"
          poetry run pytest -p no:cacheprovider tests/acceptance --runxfail -q -ra --maxfail=5 \
            --basetemp="${RUNNER_TEMP}/adminme-consistency-pytest"

      - name: Validate bridge package
        run: |
          poetry -C bridge sync --with dev --no-interaction
          poetry -C bridge run pytest -p no:cacheprovider -q \
            --basetemp="${RUNNER_TEMP}/adminme-consistency-pytest"
          poetry -C bridge run ruff check adminme_bridge tests
          poetry -C bridge run mypy adminme_bridge

      - name: Validate OpenClaw plugin
        run: |
          npm ci --prefix openclaw/administrateme --ignore-scripts
          npm run check --prefix openclaw/administrateme
          npm test --prefix openclaw/administrateme

      - name: Validate candidate diff
        env:
          ADMINME_BASE_REF: origin/${{ github.base_ref }}
        run: |
          git diff --check "$ADMINME_BASE_REF...HEAD"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Record hosted test storage
        if: ${{ always() }}
        run: |
          df -h "${RUNNER_TEMP}"
          if [[ -d "${RUNNER_TEMP}/adminme-consistency-pytest" ]]; then
            du -sh "${RUNNER_TEMP}/adminme-consistency-pytest"
          fi
