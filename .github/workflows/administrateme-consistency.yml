name: AdministrateMe consistency

on:
  workflow_call:
    inputs:
      g002_orchestrated:
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: administrateme-consistency-${{ github.ref }}-${{ inputs.g002_orchestrated && 'g002' || 'direct' }}
  cancel-in-progress: true

jobs:
  # Keep this job name stable because protected main requires it.
  deterministic-consistency:
    name: ${{ inputs.g002_orchestrated && 'g002-deterministic-consistency' || 'deterministic-consistency' }}
    if: >-
      github.event_name != 'pull_request' ||
      inputs.g002_orchestrated ||
      vars.ADMINME_CODEX_REVIEW_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: bridge
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.6"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: openclaw/administrateme/package-lock.json

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Install locked dependencies
        run: poetry sync --with dev

      - name: Validate Python behavior
        run: |
          poetry run pytest -p no:cacheprovider -q
          poetry run pytest -p no:cacheprovider tests/acceptance --runxfail -q

      - name: Validate bridge package
        run: |
          poetry -C bridge sync --with dev --no-interaction
          poetry -C bridge run pytest -p no:cacheprovider -q
          poetry -C bridge run ruff check adminme_bridge tests
          poetry -C bridge run mypy adminme_bridge

      - name: Validate architecture, style, and types
        run: |
          poetry run ruff check .
          poetry run ruff format --check adminme bootstrap bridge packs scripts tests tools
          poetry run mypy adminme bridge/adminme_bridge bootstrap
          poetry run pyright adminme bridge/adminme_bridge bootstrap packs
          bash scripts/verify_invariants.sh
          poetry check --lock

      - name: Validate OpenClaw plugin
        run: |
          npm ci --prefix openclaw/administrateme --ignore-scripts
          npm run check --prefix openclaw/administrateme
          npm test --prefix openclaw/administrateme

      - name: Validate candidate diff
        env:
          ADMINME_BASE_REF: origin/${{ github.base_ref }}
        run: |
          git diff --check "$ADMINME_BASE_REF...HEAD"
          git diff --check
          test -z "$(git status --porcelain)"
