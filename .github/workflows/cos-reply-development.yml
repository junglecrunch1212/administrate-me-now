name: CoS reply development
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'adminme/**'
      - 'bootstrap/**'
      - 'openclaw/administrateme/**'
      - 'tests/**'
      - '.github/workflows/cos-reply-development.yml'
permissions:
  contents: read
jobs:
  focused:
    if: github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ADMINME_TEST_MODE: '1'
      PYTHONPATH: bridge
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-o tmp_path_retention_policy=failed'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install locked development environment
        run: |
          python -m pip install 'poetry==2.4.1'
          poetry sync --with dev --no-interaction
          npm ci --prefix openclaw/administrateme --ignore-scripts
      - name: Validate private standing reply composition and lifecycle
        run: >-
          poetry run pytest -p no:cacheprovider --runxfail -q -ra
          --basetemp="$RUNNER_TEMP/cos-reply-tests"
          tests/acceptance/test_cos_self_reminders.py
          tests/acceptance/test_cos_self_replies.py
          tests/acceptance/test_cos_response_execution.py
          tests/acceptance/test_forwarded_channel_intake.py
          tests/unit/test_cos_channel_operation.py
          tests/unit/test_cos_response_assurance.py
          tests/unit/test_source_assurance.py
          tests/unit/test_historical_attribution.py
          tests/unit/test_lifecycle_catalog.py
          tests/unit/bootstrap/test_cos_channel_activation.py
          tests/unit/bootstrap/test_cos_reply_hooks.py
          tests/unit/bootstrap/test_member_bridge_component.py
          tests/unit/bootstrap/test_openclaw_plugin_reconciliation.py
      - name: Validate native hook, guard and configuration contracts
        if: '!cancelled()'
        run: |
          npm run check --prefix openclaw/administrateme
          npm test --prefix openclaw/administrateme
      - name: Validate style, types and privacy
        if: '!cancelled()'
        run: |
          poetry run ruff check .
          poetry run ruff format --check adminme bootstrap bridge packs scripts tests tools
          poetry run python scripts/generate_event_lifecycle_catalog.py --check
          poetry run mypy adminme bridge/adminme_bridge bootstrap
          poetry run pyright adminme bridge/adminme_bridge bootstrap packs
          bash scripts/verify_invariants.sh
          poetry check --lock
          git diff --check
  pinned-renderer:
    if: github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Exercise native hook admission and the pinned sender with synthetic text
        run: |
          npm ci --prefix openclaw/administrateme --ignore-scripts
          bash bootstrap/install-openclaw-source.sh --instance-root "$RUNNER_TEMP/cos-source" --python "$(command -v python)"
          commit=$(python -c 'import json; print(json.load(open("bootstrap/versions.json"))["openclaw"]["commit"])')
          node openclaw/administrateme/scripts/check-cos-imessage-text.mjs "$RUNNER_TEMP/cos-source/app/openclaw/$commit"
          node openclaw/administrateme/scripts/check-self-reminder-gateway.mjs "$RUNNER_TEMP/cos-source/app/openclaw/$commit"

  pinned-gateway:
    if: github.event.pull_request.draft
    runs-on: macos-15
    timeout-minutes: 40
    env:
      ADMINME_TEST_MODE: '1'
      PYTHONPATH: bridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install locked Gateway probe environment
        run: |
          python -m pip install 'poetry==2.4.1'
          poetry sync --with dev --no-interaction
          npm ci --prefix openclaw/administrateme --ignore-scripts
      - name: Verify real Gateway workstation reads and independent approvals
        run: bash scripts/acceptance/openclaw-source-install.sh --service-work-and-approval
      - name: Retain isolated Gateway diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cos-approval-gateway-focused
          path: |
            ${{ runner.temp }}/adminme-approval-gateway-evidence
            ${{ runner.temp }}/adminme-browser-gateway-evidence
          if-no-files-found: error
          retention-days: 7
