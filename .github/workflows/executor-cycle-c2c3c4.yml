name: Executor cycle c2-c4 only (recovery)

# Recovery workflow for resuming an executor cycle from c2 when c1 has
# already shipped via a separate path. Used in 11a's recovery on 2026-05-16:
# c1 ran successfully in executor-cycle.yml run #4 but the workflow's
# `gh pr create` step failed due to the repo's "Allow GitHub Actions to
# create and approve pull requests" setting being off. c1's branch was
# pushed, and the PR was opened manually via Partner+MCP (PR #91). After
# operator merges PR #91 and flips the repo setting, this recovery
# workflow runs c2/c3/c4.
#
# All three PRs base on main (NOT stacked bases) to avoid the stacked-
# merge anti-pattern from 10c-iii (PR #86 recovery). Operator merges in
# order; each subsequent PR's diff cleans up automatically as the
# preceding PR lands on main.
#
# Setup: docs/SETUP-AUTONOMOUS-LOOP.md must be complete. Repo setting
# "Allow GitHub Actions to create and approve pull requests" must be
# enabled.
#
# Cost: ~$45-100 (c2 + c3 + c4 only; c1's ~$30 already spent).

on:
  workflow_dispatch:
    inputs:
      prompt_id:
        description: 'Prompt ID (e.g., 11a) — c1 must already be merged to main, claude/<prompt>-c1 branch may or may not still exist on origin'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: executor-cycle-c2c3c4
  cancel-in-progress: false

env:
  ADMINME_MODEL_EXECUTOR: opus

jobs:
  c2:
    name: c2 (module A)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main (post-c1-merge)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Install claude-code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Verify prompt exists
        run: |
          MATCHES=$(ls prompts/_active/${{ inputs.prompt_id }}-*.md 2>/dev/null | wc -l)
          if [ "$MATCHES" -eq 0 ]; then
            echo "::error::No prompt file found at prompts/_active/${{ inputs.prompt_id }}-*.md"
            exit 1
          fi
          ls prompts/_active/${{ inputs.prompt_id }}-*.md

      - name: Verify c1 is on main
        run: |
          # Quick smoke check: at least one commit on main since the last
          # known good merge should mention "phase ${{ inputs.prompt_id }} commit 1"
          if ! git log --oneline -50 | grep -q "phase ${{ inputs.prompt_id }} commit 1"; then
            echo "::warning::No 'phase ${{ inputs.prompt_id }} commit 1' found in last 50 commits on main. c1 may not be merged yet. Proceeding anyway, but c2 will likely produce a wrong diff."
          fi

      - name: Configure git
        run: |
          git config user.email 'claude+executor@anthropic.com'
          git config user.name 'claude (executor-c2)'

      - name: Create c2 branch (off main, which has c1)
        run: git checkout -b "claude/${{ inputs.prompt_id }}-c2"

      - name: Run c2 (commit + push only — no PR open)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_ID: ${{ inputs.prompt_id }}
        run: |
          set -e
          INSTRUCTION="Read .claude/agents/executor-c2.md fully and follow it. Work prompt: prompts/_active/${PROMPT_ID}-*.md. Execute Commit 2 only. Branch strategy: stacked per BRANCH-STRATEGY.md — note: this is a recovery run; c1 is already on main. Branch off main (already done). After commit, push to origin via the explicit-URL token pattern in the agent. DO NOT open the PR — the workflow will open it. Stop after push completes."

          claude --print \
                 --model "${ADMINME_MODEL_EXECUTOR}" \
                 --permission-mode bypassPermissions \
                 "$INSTRUCTION" \
                 < /dev/null 2>&1 | tee /tmp/c2.log

          if grep -q "<COMMIT_FAILED" /tmp/c2.log; then
            echo "::error::c2 exited with <COMMIT_FAILED/>. See log above."
            exit 1
          fi
          if grep -q "<NEEDS_AMENDMENT" /tmp/c2.log; then
            echo "::error::c2 surfaced <NEEDS_AMENDMENT/>. Constitutional drift; Partner must handle."
            exit 1
          fi

      - name: Open c2 PR (base=main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_ID: ${{ inputs.prompt_id }}
        run: |
          set -euo pipefail
          echo "--- gh auth status ---"
          gh auth status
          echo "--- existing PRs for head (if any) ---"
          gh pr list --head "claude/${PROMPT_ID}-c2" --state all --json number,state,title || true
          echo "--- fetch origin ---"
          git fetch origin
          echo "--- branch state ---"
          git log -1 --format='SHA=%H%nSubject=%s' "claude/${PROMPT_ID}-c2"
          SUBJECT=$(git log -1 --format=%s "claude/${PROMPT_ID}-c2")
          BODY=$(git log -1 --format=%b "claude/${PROMPT_ID}-c2")
          if [ -z "$BODY" ]; then BODY="(no commit body)"; fi
          echo "Title to use: $SUBJECT"
          echo "Body preview (first 3 lines):"
          echo "$BODY" | head -3
          echo "--- creating PR (base=main) ---"
          gh pr create \
            --base main \
            --head "claude/${PROMPT_ID}-c2" \
            --title "$SUBJECT" \
            --body "$BODY"
          echo "--- verifying PR ---"
          gh pr view "claude/${PROMPT_ID}-c2" --json number,url,state

  c3:
    name: c3 (module B)
    needs: c2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout c2 branch
        uses: actions/checkout@v4
        with:
          ref: claude/${{ inputs.prompt_id }}-c2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Install claude-code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        run: |
          git config user.email 'claude+executor@anthropic.com'
          git config user.name 'claude (executor-c3)'

      - name: Create c3 branch (off c2)
        run: git checkout -b "claude/${{ inputs.prompt_id }}-c3"

      - name: Run c3 (commit + push only — no PR open)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_ID: ${{ inputs.prompt_id }}
        run: |
          set -e
          INSTRUCTION="Read .claude/agents/executor-c3.md fully and follow it. Work prompt: prompts/_active/${PROMPT_ID}-*.md. Execute Commit 3 only. Branch strategy: stacked per BRANCH-STRATEGY.md. After commit, push to origin via the explicit-URL token pattern in the agent. DO NOT open the PR — the workflow will open it. Stop after push completes."

          claude --print \
                 --model "${ADMINME_MODEL_EXECUTOR}" \
                 --permission-mode bypassPermissions \
                 "$INSTRUCTION" \
                 < /dev/null 2>&1 | tee /tmp/c3.log

          if grep -q "<COMMIT_FAILED" /tmp/c3.log; then
            echo "::error::c3 exited with <COMMIT_FAILED/>. See log above."
            exit 1
          fi
          if grep -q "<NEEDS_AMENDMENT" /tmp/c3.log; then
            echo "::error::c3 surfaced <NEEDS_AMENDMENT/>. Constitutional drift; Partner must handle."
            exit 1
          fi

      - name: Open c3 PR (base=main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_ID: ${{ inputs.prompt_id }}
        run: |
          set -euo pipefail
          echo "--- gh auth status ---"
          gh auth status
          echo "--- existing PRs for head (if any) ---"
          gh pr list --head "claude/${PROMPT_ID}-c3" --state all --json number,state,title || true
          echo "--- fetch origin ---"
          git fetch origin
          echo "--- branch state ---"
          git log -1 --format='SHA=%H%nSubject=%s' "claude/${PROMPT_ID}-c3"
          SUBJECT=$(git log -1 --format=%s "claude/${PROMPT_ID}-c3")
          BODY=$(git log -1 --format=%b "claude/${PROMPT_ID}-c3")
          if [ -z "$BODY" ]; then BODY="(no commit body)"; fi
          echo "Title to use: $SUBJECT"
          echo "Body preview (first 3 lines):"
          echo "$BODY" | head -3
          echo "--- creating PR (base=main) ---"
          gh pr create \
            --base main \
            --head "claude/${PROMPT_ID}-c3" \
            --title "$SUBJECT" \
            --body "$BODY"
          echo "--- verifying PR ---"
          gh pr view "claude/${PROMPT_ID}-c3" --json number,url,state

  c4:
    name: c4 (integration + BUILD_LOG + PR)
    needs: c3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout c3 branch
        uses: actions/checkout@v4
        with:
          ref: claude/${{ inputs.prompt_id }}-c3
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Install claude-code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        run: |
          git config user.email 'claude+executor@anthropic.com'
          git config user.name 'claude (executor-c4)'

      - name: Create c4 branch (off c3)
        run: git checkout -b "claude/${{ inputs.prompt_id }}-c4"

      - name: Pre-flight stack integrity check
        run: |
          # Recovery context: c1 is already merged to main, so c2+c3 above
          # origin/main = 2 priors (not 3 as in the normal cycle). The pre-
          # flight check uses 2 as the expected minimum here.
          EXPECTED_PRIORS=2
          ACTUAL_PRIORS=$(git log --oneline origin/main..HEAD | wc -l)
          if [ "$ACTUAL_PRIORS" -lt "$EXPECTED_PRIORS" ]; then
            echo "::error::c4 branch has $ACTUAL_PRIORS prior commits; expected at least $EXPECTED_PRIORS (c2+c3 with c1 already on main)."
            echo "::error::Likely c1 not yet merged, or c2/c3 branched off wrong base."
            exit 1
          fi
          echo "Stack integrity OK: $ACTUAL_PRIORS commits visible above origin/main (c2+c3 stack, c1 already on main)."

      - name: Run c4 (commit + push only — no PR open)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_ID: ${{ inputs.prompt_id }}
        run: |
          set -e
          INSTRUCTION="Read .claude/agents/executor-c4.md fully and follow it. Work prompt: prompts/_active/${PROMPT_ID}-*.md. Execute Commit 4 only. Branch strategy: stacked per BRANCH-STRATEGY.md (recovery run; c1 is on main, c2+c3 are above). After commit, push to origin via the explicit-URL token pattern in the agent. DO NOT open the PR — the workflow will open it. Stop after push completes."

          claude --print \
                 --model "${ADMINME_MODEL_EXECUTOR}" \
                 --permission-mode bypassPermissions \
                 "$INSTRUCTION" \
                 < /dev/null 2>&1 | tee /tmp/c4.log

          if grep -q "<COMMIT_FAILED" /tmp/c4.log; then
            echo "::error::c4 exited with <COMMIT_FAILED/>. See log above."
            exit 1
          fi
          if grep -q "<NEEDS_AMENDMENT" /tmp/c4.log; then
            echo "::error::c4 surfaced <NEEDS_AMENDMENT/>. Constitutional drift; Partner must handle."
            exit 1
          fi

      - name: Open c4 PR (base=main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_ID: ${{ inputs.prompt_id }}
        run: |
          set -euo pipefail
          echo "--- gh auth status ---"
          gh auth status
          echo "--- existing PRs for head (if any) ---"
          gh pr list --head "claude/${PROMPT_ID}-c4" --state all --json number,state,title || true
          echo "--- fetch origin ---"
          git fetch origin
          echo "--- branch state ---"
          git log -1 --format='SHA=%H%nSubject=%s' "claude/${PROMPT_ID}-c4"
          SUBJECT=$(git log -1 --format=%s "claude/${PROMPT_ID}-c4")
          BODY=$(git log -1 --format=%b "claude/${PROMPT_ID}-c4")
          if [ -z "$BODY" ]; then BODY="(no commit body)"; fi
          echo "Title to use: $SUBJECT"
          echo "Body preview (first 3 lines):"
          echo "$BODY" | head -3
          echo "--- creating PR (base=main) ---"
          gh pr create \
            --base main \
            --head "claude/${PROMPT_ID}-c4" \
            --title "$SUBJECT" \
            --body "$BODY"
          echo "--- verifying PR ---"
          gh pr view "claude/${PROMPT_ID}-c4" --json number,url,state
