name: Advisory dependency audit

on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisory-security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.7"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: openclaw/administrateme/package-lock.json

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Audit locked Python environments
        run: |
          poetry sync --with dev --no-interaction
          poetry run pip-audit --local --progress-spinner off
          poetry -C bridge sync --with dev --no-interaction
          poetry -C bridge run pip-audit --local --progress-spinner off

      - name: Audit locked OpenClaw dependencies
        run: |
          npm ci --prefix openclaw/administrateme --ignore-scripts
          npm --prefix openclaw/administrateme audit --omit=dev
