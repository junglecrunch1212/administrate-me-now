name: Executor cycle (c1→c4)

# Runs the four-commit Executor cycle for a given prompt ID, end-to-end,
# unattended. Replaces the JRS Codespace terminal flow described in
# docs/RUNBOOK-EXECUTOR.md §1.1-§1.5 with a one-button click in the
# Actions tab.
#
# STACKED branch strategy per docs/BRANCH-STRATEGY.md:
#   c1 branches from main
#   c2 branches from claude/<prompt>-c1
#   c3 branches from claude/<prompt>-c2
#   c4 branches from claude/<prompt>-c3
# Each c-band opens its own PR. Operator merges in sequence after review.
#
# 2026-05-15 run-1 fixes (PR #80):
#   - c4 pre-flight uses origin/main..HEAD (was main..HEAD; actions/checkout
#     only creates a local branch for the checked-out ref).
#   - PR creation moved from the agent (curl in executor-cN.md) to the
#     workflow itself (gh CLI).
#
# 2026-05-15 run-2 fixes (this PR):
#   - "Open cN PR" steps now fail visibly on gh pr create errors instead
#     of swallowing them via `|| echo`. Adds gh auth status + verbose
#     diagnostics + post-create gh pr view so logs reveal what's happening.
#
# Setup: docs/SETUP-AUTONOMOUS-LOOP.md must be complete first.
# Source patterns: docs/RUNBOOK-EXECUTOR.md §1.1-§1.5 + .claude/agents/executor-c{1,2,3,4}.md
#
# Cost per full cycle:
#   ANTHROPIC_API_KEY: ~$60-120 (opus tokens)
#   CLAUDE_CODE_OAUTH_TOKEN: $0 in API dollars, ~10-25% of weekly subscription cap

on:
  workflow_dispatch:
    inputs:
      prompt_id:
        description: 'Prompt ID, e.g. 10c-iii (must exist as prompts/_active/<prompt_id>-*.md on main)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: executor-cycle
  cancel-in-progress: false

env:
  ADMINME_MODEL_EXECUTOR: opus

jobs:
  c1:
    name: c1 (schema / plumbing)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install claude-code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Verify prompt exists
        run: |
          MATCHES=$(ls prompts/_active/${{ inputs.prompt_id }}-*.md 2>/dev/null | wc -l)
          if [ "$MATCHES" -eq 0 ]; then
            echo "::error::No prompt file found at prompts/_active/${{ inputs.prompt_id }}-*.md"
            exit 1
          fi
          ls prompts/_active/${{ inputs.prompt_id }}-*.md

      - name: Configure git
        run: |
          git config user.email 'claude+executor@anthropic.com'
          git config user.name 'claude (executor-c1)'

      - name: Create c1 branch
        run: git checkout -b "claude/${{ inputs.prompt_id }}-c1"

      - name: Run c1 (commit + push only — no PR open)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_ID: ${{ inputs.prompt_id }}
        run: |
          set -e
          INSTRUCTION="Read .claude/agents/executor-c1.md fully and follow it. Work prompt: prompts/_active/${PROMPT_ID}-*.md. Execute Commit 1 only. Branch strategy: stacked per BRANCH-STRATEGY.md. After commit, push to origin via the explicit-URL token pattern in the agent. DO NOT open the PR — the workflow will open it. Stop after push completes."

          claude --print \
                 --model "${ADMINME_MODEL_EXECUTOR}" \
                 --max-budget-usd 30 \
                 --permission-mode bypassPermissions \
                 "$INSTRUCTION" \
                 < /dev/null 2>&1 | tee /tmp/c1.log

          if grep -q "<COMMIT_FAILED" /tmp/c1.log; then
            echo "::error::c1 exited with <COMMIT_FAILED/>. See log above."
            exit 1
          fi
          if grep -q "<NEEDS_AMENDMENT" /tmp/c1.log; then
            echo "::error::c1 surfaced <NEEDS_AMENDMENT/>. Constitutional drift; Partner must handle."
            exit 1
          fi

      - name: Open c1 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_ID: ${{ inputs.prompt_id }}
        run: |
          set -euo pipefail
          echo "--- gh auth status ---"
          gh auth status
          echo "--- existing PRs for head (if any) ---"
          gh pr list --head "claude/${PROMPT_ID}-c1" --state all --json number,state,title || true
          echo "--- fetch origin (refresh refs) ---"
          git fetch origin
          echo "--- branch state ---"
          git log -1 --format='SHA=%H%nSubject=%s' "claude/${PROMPT_ID}-c1"
          SUBJECT=$(git log -1 --format=%s "claude/${PROMPT_ID}-c1")
          BODY=$(git log -1 --format=%b "claude/${PROMPT_ID}-c1")
          if [ -z "$BODY" ]; then BODY="(no commit body)"; fi
          echo "Title to use: $SUBJECT"
          echo "Body preview (first 3 lines):"
          echo "$BODY" | head -3
          echo "--- creating PR ---"
          gh pr create \
            --base main \
            --head "claude/${PROMPT_ID}-c1" \
            --title "$SUBJECT" \
            --body "$BODY"
          echo "--- verifying PR ---"
          gh pr view "claude/${PROMPT_ID}-c1" --json number,url,state

  c2:
    name: c2 (module A)
    needs: c1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout c1 branch
        uses: actions/checkout@v4
        with:
          ref: claude/${{ inputs.prompt_id }}-c1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install claude-code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        run: |
          git config user.email 'claude+executor@anthropic.com'
          git config user.name 'claude (executor-c2)'

      - name: Create c2 branch
        run: git checkout -b "claude/${{ inputs.prompt_id }}-c2"

      - name: Run c2 (commit + push only — no PR open)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_ID: ${{ inputs.prompt_id }}
        run: |
          set -e
          INSTRUCTION="Read .claude/agents/executor-c2.md fully and follow it. Work prompt: prompts/_active/${PROMPT_ID}-*.md. Execute Commit 2 only. Branch strategy: stacked per BRANCH-STRATEGY.md. After commit, push to origin via the explicit-URL token pattern in the agent. DO NOT open the PR — the workflow will open it. Stop after push completes."

          claude --print \
                 --model "${ADMINME_MODEL_EXECUTOR}" \
                 --max-budget-usd 40 \
                 --permission-mode bypassPermissions \
                 "$INSTRUCTION" \
                 < /dev/null 2>&1 | tee /tmp/c2.log

          if grep -q "<COMMIT_FAILED" /tmp/c2.log; then
            echo "::error::c2 exited with <COMMIT_FAILED/>. See log above."
            exit 1
          fi
          if grep -q "<NEEDS_AMENDMENT" /tmp/c2.log; then
            echo "::error::c2 surfaced <NEEDS_AMENDMENT/>. Constitutional drift; Partner must handle."
            exit 1
          fi

      - name: Open c2 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_ID: ${{ inputs.prompt_id }}
        run: |
          set -euo pipefail
          echo "--- gh auth status ---"
          gh auth status
          echo "--- existing PRs for head (if any) ---"
          gh pr list --head "claude/${PROMPT_ID}-c2" --state all --json number,state,title || true
          echo "--- fetch origin (refresh refs) ---"
          git fetch origin
          echo "--- branch state ---"
          git log -1 --format='SHA=%H%nSubject=%s' "claude/${PROMPT_ID}-c2"
          SUBJECT=$(git log -1 --format=%s "claude/${PROMPT_ID}-c2")
          BODY=$(git log -1 --format=%b "claude/${PROMPT_ID}-c2")
          if [ -z "$BODY" ]; then BODY="(no commit body)"; fi
          echo "Title to use: $SUBJECT"
          echo "Body preview (first 3 lines):"
          echo "$BODY" | head -3
          echo "--- creating PR ---"
          gh pr create \
            --base "claude/${PROMPT_ID}-c1" \
            --head "claude/${PROMPT_ID}-c2" \
            --title "$SUBJECT" \
            --body "$BODY"
          echo "--- verifying PR ---"
          gh pr view "claude/${PROMPT_ID}-c2" --json number,url,state

  c3:
    name: c3 (module B)
    needs: c2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout c2 branch
        uses: actions/checkout@v4
        with:
          ref: claude/${{ inputs.prompt_id }}-c2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install claude-code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        run: |
          git config user.email 'claude+executor@anthropic.com'
          git config user.name 'claude (executor-c3)'

      - name: Create c3 branch
        run: git checkout -b "claude/${{ inputs.prompt_id }}-c3"

      - name: Run c3 (commit + push only — no PR open)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_ID: ${{ inputs.prompt_id }}
        run: |
          set -e
          INSTRUCTION="Read .claude/agents/executor-c3.md fully and follow it. Work prompt: prompts/_active/${PROMPT_ID}-*.md. Execute Commit 3 only. Branch strategy: stacked per BRANCH-STRATEGY.md. After commit, push to origin via the explicit-URL token pattern in the agent. DO NOT open the PR — the workflow will open it. Stop after push completes."

          claude --print \
                 --model "${ADMINME_MODEL_EXECUTOR}" \
                 --max-budget-usd 50 \
                 --permission-mode bypassPermissions \
                 "$INSTRUCTION" \
                 < /dev/null 2>&1 | tee /tmp/c3.log

          if grep -q "<COMMIT_FAILED" /tmp/c3.log; then
            echo "::error::c3 exited with <COMMIT_FAILED/>. See log above."
            exit 1
          fi
          if grep -q "<NEEDS_AMENDMENT" /tmp/c3.log; then
            echo "::error::c3 surfaced <NEEDS_AMENDMENT/>. Constitutional drift; Partner must handle."
            exit 1
          fi

      - name: Open c3 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_ID: ${{ inputs.prompt_id }}
        run: |
          set -euo pipefail
          echo "--- gh auth status ---"
          gh auth status
          echo "--- existing PRs for head (if any) ---"
          gh pr list --head "claude/${PROMPT_ID}-c3" --state all --json number,state,title || true
          echo "--- fetch origin (refresh refs) ---"
          git fetch origin
          echo "--- branch state ---"
          git log -1 --format='SHA=%H%nSubject=%s' "claude/${PROMPT_ID}-c3"
          SUBJECT=$(git log -1 --format=%s "claude/${PROMPT_ID}-c3")
          BODY=$(git log -1 --format=%b "claude/${PROMPT_ID}-c3")
          if [ -z "$BODY" ]; then BODY="(no commit body)"; fi
          echo "Title to use: $SUBJECT"
          echo "Body preview (first 3 lines):"
          echo "$BODY" | head -3
          echo "--- creating PR ---"
          gh pr create \
            --base "claude/${PROMPT_ID}-c2" \
            --head "claude/${PROMPT_ID}-c3" \
            --title "$SUBJECT" \
            --body "$BODY"
          echo "--- verifying PR ---"
          gh pr view "claude/${PROMPT_ID}-c3" --json number,url,state

  c4:
    name: c4 (integration + BUILD_LOG + PR)
    needs: c3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout c3 branch
        uses: actions/checkout@v4
        with:
          ref: claude/${{ inputs.prompt_id }}-c3
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install claude-code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        run: |
          git config user.email 'claude+executor@anthropic.com'
          git config user.name 'claude (executor-c4)'

      - name: Create c4 branch
        run: git checkout -b "claude/${{ inputs.prompt_id }}-c4"

      - name: Pre-flight stack integrity check
        run: |
          # Use origin/main not main — actions/checkout only creates a local
          # branch for the checked-out ref; main isn't a local branch here.
          EXPECTED_PRIORS=3
          ACTUAL_PRIORS=$(git log --oneline origin/main..HEAD | wc -l)
          if [ "$ACTUAL_PRIORS" -lt "$EXPECTED_PRIORS" ]; then
            echo "::error::c4 branch has $ACTUAL_PRIORS prior commits; expected $EXPECTED_PRIORS (c1+c2+c3)."
            echo "::error::Likely branched off wrong base per POSTMORTEM-v3-to-v4 §1.6."
            exit 1
          fi
          echo "Stack integrity OK: $ACTUAL_PRIORS commits visible above origin/main."

      - name: Run c4 (commit + push only — no PR open)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_ID: ${{ inputs.prompt_id }}
        run: |
          set -e
          INSTRUCTION="Read .claude/agents/executor-c4.md fully and follow it. Work prompt: prompts/_active/${PROMPT_ID}-*.md. Execute Commit 4 only. Branch strategy: stacked per BRANCH-STRATEGY.md. After commit, push to origin via the explicit-URL token pattern in the agent. DO NOT open the PR — the workflow will open it. Stop after push completes."

          claude --print \
                 --model "${ADMINME_MODEL_EXECUTOR}" \
                 --max-budget-usd 50 \
                 --permission-mode bypassPermissions \
                 "$INSTRUCTION" \
                 < /dev/null 2>&1 | tee /tmp/c4.log

          if grep -q "<COMMIT_FAILED" /tmp/c4.log; then
            echo "::error::c4 exited with <COMMIT_FAILED/>. See log above."
            exit 1
          fi
          if grep -q "<NEEDS_AMENDMENT" /tmp/c4.log; then
            echo "::error::c4 surfaced <NEEDS_AMENDMENT/>. Constitutional drift; Partner must handle."
            exit 1
          fi

      - name: Open c4 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_ID: ${{ inputs.prompt_id }}
        run: |
          set -euo pipefail
          echo "--- gh auth status ---"
          gh auth status
          echo "--- existing PRs for head (if any) ---"
          gh pr list --head "claude/${PROMPT_ID}-c4" --state all --json number,state,title || true
          echo "--- fetch origin (refresh refs) ---"
          git fetch origin
          echo "--- branch state ---"
          git log -1 --format='SHA=%H%nSubject=%s' "claude/${PROMPT_ID}-c4"
          SUBJECT=$(git log -1 --format=%s "claude/${PROMPT_ID}-c4")
          BODY=$(git log -1 --format=%b "claude/${PROMPT_ID}-c4")
          if [ -z "$BODY" ]; then BODY="(no commit body)"; fi
          echo "Title to use: $SUBJECT"
          echo "Body preview (first 3 lines):"
          echo "$BODY" | head -3
          echo "--- creating PR ---"
          gh pr create \
            --base "claude/${PROMPT_ID}-c3" \
            --head "claude/${PROMPT_ID}-c4" \
            --title "$SUBJECT" \
            --body "$BODY"
          echo "--- verifying PR ---"
          gh pr view "claude/${PROMPT_ID}-c4" --json number,url,state
