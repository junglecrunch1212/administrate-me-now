name: Smoke test (claude-code auth)

# Manual-only. Validates ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN, if ever
# configured later) + Actions plumbing before running the full executor-cycle
# workflow.
#
# See docs/SETUP-AUTONOMOUS-LOOP.md for one-time setup before first run.
#
# Cost: ~$0.001 in API dollars (one Haiku call). Negligible.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-test
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install claude-code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Verify at least one auth secret is set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "Using ANTHROPIC_API_KEY (API-tier billing — pay-per-token)."
          elif [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Using CLAUDE_CODE_OAUTH_TOKEN (subscription billing — flat-fee)."
          else
            echo "::error::No auth secret configured."
            echo "::error::Set either ANTHROPIC_API_KEY (recommended, web-only setup) or CLAUDE_CODE_OAUTH_TOKEN."
            echo "::error::See docs/SETUP-AUTONOMOUS-LOOP.md §1-§2 for setup."
            exit 1
          fi

      - name: One cheap Haiku call to verify auth
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -e
          echo "Calling Haiku with a one-word prompt..."
          claude --print \
                 --model haiku \
                 --max-budget-usd 1 \
                 --permission-mode bypassPermissions \
                 'Reply with exactly the word OK.' \
                 < /dev/null
          echo "---"
          echo "Smoke test PASSED. Auth valid, claude-code installed, Actions plumbing works."
