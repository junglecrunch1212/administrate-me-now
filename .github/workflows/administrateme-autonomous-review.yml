name: AdministrateMe early adversarial review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: administrateme-adversarial-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    if: >-
      vars.ADMINME_CODEX_REVIEW_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      review_result: ${{ steps.codex.outputs.final-message }}
      review_started_at: ${{ steps.review-clock.outputs.started_at }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch current base without credentials persistence
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"

      - name: Record immutable review start
        id: review-clock
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Materialize effective base-controlled review contract
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          git show "$BASE_REF:.github/codex/prompts/g002-adversarial-review.md" > "$RUNNER_TEMP/g002-adversarial-review.md"
          git show "$BASE_REF:schemas/harness/hosted-review-result.schema.json" > "$RUNNER_TEMP/hosted-review-result.schema.json"
          chmod 0400 "$RUNNER_TEMP/g002-adversarial-review.md" "$RUNNER_TEMP/hosted-review-result.schema.json"

      - name: Run isolated read-only Codex review
        id: codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/g002-adversarial-review.md
          output-schema-file: ${{ runner.temp }}/hosted-review-result.schema.json
          codex-args: '["--ephemeral"]'
          sandbox: read-only
          safety-strategy: drop-sudo

  exact-head-review:
    needs: codex-review
    if: always() && needs.codex-review.result != 'skipped'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      macos_required: ${{ steps.receipt.outputs.macos_required }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch current base without credentials persistence
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"

      - name: Materialize effective base-controlled binding helper
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          git show "$BASE_REF:scripts/harness/hosted_binding.py" > "$RUNNER_TEMP/hosted_binding.py"
          chmod 0500 "$RUNNER_TEMP/hosted_binding.py"

      - name: Validate exact-head conclusion and prepare content-free receipt
        id: receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          REVIEW_RESULT: ${{ needs.codex-review.outputs.review_result }}
          REVIEW_STARTED_AT: ${{ needs.codex-review.outputs.review_started_at }}
          REVIEW_OUTPUT_DIR: ${{ runner.temp }}/g002-review-output
        run: |
          python -I - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          output_dir = Path(os.environ["REVIEW_OUTPUT_DIR"])
          output_dir.mkdir(mode=0o700, exist_ok=False)
          result = json.loads(os.environ["REVIEW_RESULT"])
          (output_dir / "g002-review.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n", "utf-8"
          )
          head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          base_tip = subprocess.check_output(
              ["git", "rev-parse", os.environ["BASE_REF"]], text=True
          ).strip()
          merge_base = subprocess.check_output(
              ["git", "merge-base", os.environ["BASE_REF"], "HEAD"], text=True
          ).strip()
          bound = json.loads(
              subprocess.check_output(
                  [
                      "python",
                      "-I",
                      os.path.join(os.environ["RUNNER_TEMP"], "hosted_binding.py"),
                      "--base",
                      base_tip,
                      "--head",
                      "HEAD",
                  ],
                  text=True,
              )
          )
          changed_paths = bound["changed_paths"]
          macos_prefixes = (
              "bootstrap/",
              "adminme/",
              "packs/adapters/",
              "openclaw/administrateme/",
              "scripts/acceptance/",
              "tests/unit/bootstrap/",
          )
          macos_exact = {
              "scripts/verify_invariants.sh",
              "tests/acceptance/test_macos_bootstrap_operations.py",
              "tests/integration/test_adapter_supervisor_gmail.py",
              ".github/workflows/macos-bootstrap.yml",
          }
          macos_required = any(
              path in macos_exact or path.startswith(macos_prefixes)
              for path in changed_paths
          )
          required_scopes = {
              "correctness",
              "privacy",
              "replay",
              "determinism",
              "surface",
              "failure_paths",
              "completeness",
              "release_boundary",
          }
          actionable = [item for item in result["findings"] if item["actionable"]]
          exact = (
              head == os.environ["EXPECTED_HEAD"]
              and result["head_sha"] == head
              and merge_base == base_tip
              and result["base_sha"] == base_tip
              and set(result["scope"]) == required_scopes
          )
          approved = (
              exact
              and result["conclusion"] == "APPROVE"
              and not actionable
              and not result["unresolved_evidence"]
          )
          receipt = {
              "schema_version": 1,
              "repository": os.environ["REPOSITORY"],
              "pull_request": int(os.environ["PULL_REQUEST"]),
              "workflow_run_id": int(os.environ["WORKFLOW_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["WORKFLOW_RUN_ATTEMPT"]),
              "head_sha": head,
              "base_sha": base_tip,
              "diff_sha256": bound["diff_sha256"],
              "review_started_at": os.environ["REVIEW_STARTED_AT"],
              "review_completed_at": datetime.now(timezone.utc).isoformat(),
              "conclusion": result["conclusion"] if exact else "UNDETERMINED",
              "actionable_finding_ids": sorted(
                  item["finding_id"] for item in actionable
              ),
              "finding_count": len(result["findings"]),
              "unresolved_evidence_count": len(result["unresolved_evidence"]),
              "workflow_run": os.environ["RUN_URL"],
          }
          (output_dir / "g002-review-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", "utf-8"
          )
          lines = [
              "<!-- administrateme-g002-review -->",
              "G-002 early adversarial review receipt",
              f"- Exact head: `{head}`",
              f"- Merge base: `{base_tip}`",
              f"- Diff binding: `{receipt['diff_sha256']}`",
              f"- Conclusion: **{receipt['conclusion']}**",
              f"- Actionable findings: {', '.join(receipt['actionable_finding_ids']) or 'none'}",
              f"- Unresolved evidence count: {receipt['unresolved_evidence_count']}",
              f"- [Workflow receipt]({receipt['workflow_run']})",
          ]
          (output_dir / "g002-review-receipt.md").write_text(
              "\n".join(lines) + "\n", "utf-8"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"approved={'true' if approved else 'false'}\n")
              output.write(f"macos_required={'true' if macos_required else 'false'}\n")
              output.write("receipt_ready=true\n")
          PY

      - name: Retain immutable review result and receipt
        if: always() && steps.receipt.outputs.receipt_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: g002-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/g002-review-output/g002-review.json
            ${{ runner.temp }}/g002-review-output/g002-review-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Post immutable content-free exact-head receipt
        if: always() && steps.receipt.outputs.receipt_ready == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RECEIPT_PATH: ${{ runner.temp }}/g002-review-output/g002-review-receipt.md
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const marker = '<!-- administrateme-g002-review -->';
            const body = fs.readFileSync(process.env.RECEIPT_PATH, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Enforce review result
        if: steps.receipt.outputs.approved != 'true'
        run: exit 1

  deterministic-consistency:
    name: consistency-suite
    needs: exact-head-review
    uses: ./.github/workflows/administrateme-consistency.yml
    with:
      g002_orchestrated: true

  g002-deterministic-consistency:
    name: g002-deterministic-consistency
    needs: deterministic-consistency
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Bind the required check to the complete reusable suite
        env:
          SUITE_RESULT: ${{ needs.deterministic-consistency.result }}
        run: test "$SUITE_RESULT" = success

  credential-free-macos-rehearsal:
    name: macos-rehearsal-suite
    needs: exact-head-review
    if: needs.exact-head-review.outputs.macos_required == 'true'
    uses: ./.github/workflows/macos-bootstrap.yml
    with:
      g002_orchestrated: true

  g002-credential-free-rehearsal:
    name: g002-credential-free-rehearsal
    needs:
      - exact-head-review
      - credential-free-macos-rehearsal
    if: >-
      always() &&
      needs.exact-head-review.outputs.macos_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Bind the required check to the complete reusable rehearsal
        env:
          SUITE_RESULT: ${{ needs.credential-free-macos-rehearsal.result }}
        run: test "$SUITE_RESULT" = success
