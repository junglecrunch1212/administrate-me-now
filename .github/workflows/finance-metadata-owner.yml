name: Focused Finance owner metadata
on:
  push:
    branches: ['codex/finance-metadata-owner-5069a36e']
permissions:
  contents: read
concurrency:
  group: finance-metadata-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  metadata-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ADMINME_TEST_MODE: '1'
      PYTHONPATH: bridge
      PYTHONDONTWRITEBYTECODE: '1'
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - run: pipx install poetry==2.4.1
      - run: poetry sync --with dev --no-interaction
      - name: Exact source and held interface checks
        run: |
          git rev-parse HEAD HEAD:poetry.lock
          git diff --exit-code 5069a36e8775013e7752bc30d350bc30be004050 HEAD -- scripts/release_scope.py tests/unit/test_ci_release_gates.py bootstrap adminme/products/openclaw pyproject.toml poetry.lock
          .venv/bin/ruff check adminme/finance adminme/events/schemas/finance* adminme/products/member/finance_metadata.py tests/acceptance/test_finance_metadata_owner.py tests/acceptance/test_finance_metadata_history.py
          .venv/bin/ruff format --check adminme/finance adminme/events/schemas/finance* adminme/products/member/finance_metadata.py tests/acceptance/test_finance_metadata_owner.py tests/acceptance/test_finance_metadata_history.py
          node --check adminme/products/member/assets/member.js
      - name: Focused isolated dependency, owner, revocation and bounded-history contracts
        timeout-minutes: 10
        env:
          FINANCE_METADATA_ARTIFACT_DIR: ${{ runner.temp }}/finance-metadata
        run: |
          mkdir -p "$FINANCE_METADATA_ARTIFACT_DIR"
          git rev-parse HEAD HEAD:adminme HEAD:poetry.lock > "$FINANCE_METADATA_ARTIFACT_DIR/source-pins.txt"
          set -o pipefail
          .venv/bin/python -m pytest -q --runxfail --durations=10 --junitxml="$FINANCE_METADATA_ARTIFACT_DIR/results.xml" tests/acceptance/test_finance_metadata_owner.py tests/acceptance/test_finance_metadata_history.py 2>&1 | tee "$FINANCE_METADATA_ARTIFACT_DIR/pytest.txt"
      - name: Preserve focused results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finance-metadata-owner
          path: ${{ runner.temp }}/finance-metadata
          if-no-files-found: error
          retention-days: 7
