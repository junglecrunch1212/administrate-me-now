<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <link rel="icon" href="data:,">
    <title>AdministrateMe · Household</title>
    <link rel="stylesheet" href="/member-assets/member.css?v=__ASSET_VERSION__">
    <script src="/member-assets/member.js?v=__ASSET_VERSION__" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to household view</a>
    <div class="app-shell">
      <aside class="rail" aria-label="Household navigation">
        <a class="brand" href="/member/today" aria-label="AdministrateMe Today">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span><strong>AdministrateMe</strong><small>household rhythm</small></span>
        </a>
        <nav id="primary-nav" class="primary-nav" aria-label="Primary"></nav>
        <div class="trust-note">
          <span class="status-dot" aria-hidden="true"></span>
          <span><strong>Private member view</strong><small>No operator access</small></span>
        </div>
      </aside>

      <main id="main" tabindex="-1">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="mode-label">Household view</p>
            <h1 id="page-title">Today</h1>
          </div>
          <div class="top-actions">
            <span id="observation-pill" class="pill pill-lavender">Observation mode</span>
            <button class="avatar" id="member-button" type="button" aria-label="Current member">M</button>
          </div>
        </header>

        <div id="state-banner" class="banner" role="status" hidden></div>
        <section id="surface" class="surface" aria-live="polite" aria-busy="true">
          <div class="skeleton wide"></div><div class="skeleton"></div><div class="skeleton"></div>
        </section>
      </main>

      <aside id="chat-panel" class="chat-panel" aria-labelledby="chat-title">
        <div class="chat-heading">
          <div><p class="eyebrow">OpenClaw CoS</p><h2 id="chat-title">A calm place to think</h2></div>
          <button id="chat-close" class="icon-button" type="button" aria-label="Close chat">×</button>
        </div>
        <div id="chat-state" class="chat-state" role="status"></div>
        <ol id="chat-messages" class="chat-messages" aria-label="Conversation"></ol>
        <form id="chat-form" class="chat-compose">
          <label for="chat-input">Message your household CoS</label>
          <textarea id="chat-input" rows="3" maxlength="4000" placeholder="What would make today feel lighter?"></textarea>
          <div class="compose-actions">
            <button id="chat-stop" class="button button-quiet" type="button" hidden>Stop</button>
            <button id="chat-send" class="button button-primary" type="submit">Send</button>
          </div>
        </form>
      </aside>
    </div>

    <button id="chat-open" class="chat-fab" type="button" aria-controls="chat-panel" aria-expanded="false">
      <span aria-hidden="true">✦</span> Ask the CoS
    </button>

    <dialog id="evidence-dialog" aria-labelledby="evidence-title">
      <div class="dialog-heading"><h2 id="evidence-title">Why this is here</h2><button class="icon-button" data-close-dialog aria-label="Close evidence">×</button></div>
      <div id="evidence-content"></div>
    </dialog>
  </body>
</html>
