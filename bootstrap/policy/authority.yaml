# Reviewed tenant-neutral AdministrateMe caller policy.
# Governance narrows these action families independently.

agent_allowlist:
  - agent_id: "system:internal"
    actions: ["*"]
  - agent_id: "system:bootstrap"
    actions: ["*"]
  - agent_id: "daemon:xlsx_reverse"
    actions:
      - "task.*"
      - "commitment.*"
      - "recurrence.*"
      - "money_flow.*"
      - "finance.*"
      - "place.*"
      - "asset.*"
      - "account.*"
  - agent_id: "daemon:xlsx_workbooks"
    actions: ["xlsx.regenerated"]
  - agent_id: "user:*"
    actions:
      - "commitment.*"
      - "communication.*"
      - "messaging.reply.*"
      - "task.*"
      - "triage.*"
      - "context.relationship.rejected"
      - "context.relationship.confirmed"
      - "context.source_text.corrected"
      - "context.source_text.reinstated"
      - "calendar.*"
      - "member_knowledge.*"
      - "recurrence.*"
      - "routine.*"
      - "reminder.*"
      - "identifier.*"
      - "party.*"
      - "relationship.*"
      - "relationship_fact.*"
      - "member_relationship.*"
      - "household.action.*"
      - "settings.*"
      - "finance.*"
      - "external_sync.*"
      - "place.*"
      - "asset.*"
      - "account.*"
  - agent_id: "openclaw:*"
    actions:
      - "household.action.*"
      - "task.*"
      - "commitment.*"
      - "communication.*"
      - "triage.*"
      - "context.relationship.rejected"
      - "context.relationship.confirmed"
      - "context.source_text.corrected"
      - "context.source_text.reinstated"
      - "calendar.*"
      - "member_knowledge.*"
      - "recurrence.*"
      - "routine.*"
      - "external_sync.*"

forbidden_outbound_parties: []
